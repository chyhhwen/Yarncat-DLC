  window.addEventListener('drop', e => {
    e.preventDefault();
    dropped.push(...[...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
    dreamNow();
  });
}
function setCursor(hit) {
  document.body.classList.toggle('grab', !!hit && hit !== 'bubble' && hit !== 'guest');
  document.body.classList.toggle('poke', hit === 'bubble' || hit === 'guest');
}

/* ═══ 摸貓：游標在貓身上左右來回滑（不用按），來回 3 次就算在摸 ═══
   貓躲在紙箱裡的時候，摸的是紙箱：來回 2 次牠就蹦出來嚇你。 */
const PETTABLE = ['sit', 'lick', 'stare', 'walk', 'beg', 'drool', 'dream', 'sleep', 'loaf', 'flop', 'pet', 'rest'];
const rub = { x: null, dir: 0, flips: 0, last: 0 };
function stroke(p) {
  const hiding = cat.state === 'hide' && !quiet;
  const onCat = hiding ? inBox(p, boxHit()) : inBox(p, catBox()) && PETTABLE.includes(cat.state);
  const onGuest = !onCat && guest && inBox(p, guestBox()) && GUEST_PETTABLE.includes(guest.state);   // 隔壁來的客人也能摸
  if (!onCat && !onGuest) { rub.x = null; rub.dir = rub.flips = 0; return; }
  const now = performance.now();
  if (rub.x !== null && Math.abs(p.x - rub.x) >= 1) {
    const s = Math.sign(p.x - rub.x);
    if (rub.dir && s !== rub.dir) {                    // 換方向了，算一次來回
      rub.flips = now - rub.last < 700 ? rub.flips + 1 : 1;
      rub.last = now;
      if (onGuest) { if (guest.state === 'pet') guest.dur = Math.max(guest.dur, guest.t + 90); else if (rub.flips >= 3) petGuest(); }
      else if (cat.state === 'pet') cat.dur = Math.max(cat.dur, cat.t + 90);   // 繼續摸就繼續呼嚕
      else if (hiding) { if (rub.flips >= 2) { rub.flips = 0; boo(p.x); } }
      else if (rub.flips >= 3) pet();
    }
    rub.dir = s;
  }
  rub.x = p.x;
}
function pet() {
  if (cat.state !== 'pet') { setState('pet', 180); note('pets'); }
  rub.flips = 0;
}
function popBubble() {                                 // 點了泡泡
  if (cat.state === 'beg') return pet();
  const b = bubbleBox();
  if (cat.state === 'dream') { burst(b); note('big_bubbles'); return setState('sit', rand(60, 120)); }   // 大泡泡：啵，破掉了
  if (cat.want === 'treat') { giveTreat((b.x0 + b.x1) / 2, b.y1); return goTreat(); }   // 想舔貓條：從泡泡掉一條下來
  // 想吃妙脆角：從泡泡掉一根下來
  if (!snack) snack = { x: clamp((b.x0 + b.x1) / 2, 6, W - 6), y: b.y1, vy: 0, landed: false, bites: 0 };
  setState('fetch', 600);
}

/* 毛球模式時 Rust 只在游標進到長條才回報位置，所以剛換成逗貓棒時 mouse 可能還是舊的。
   等第一個游標事件到了再把線放好，不然線會從舊位置甩過來。 */
let wandStale = false;

/* ═══ 互動：拖貓、甩球、搬家具、丟便便、拿貓條 ═══
   家具、便便按下去沒怎麼動就放開，算是「點一下」：鏟便便、把翻倒的貓砂盆翻回來。 */
let drag = null;

window.addEventListener('pointerdown', e => {
  const p = toWorld(e), kind = hitTest(p);
  if (!kind) return;
  e.preventDefault();
  if (kind === 'bubble') { popBubble(); return; }
  if (kind === 'guest') { petGuest(); return; }        // 點一下客人：瞇眼呼嚕
  if (kind === 'box' && cat.state === 'hide') { if (!quiet) boo(p.x); return; }   // 碰到躲著貓的紙箱：蹦出來嚇你
  if (ch() && ch().grab) ch().grab(kind, p);           // 角色的東西被抓起來那一刻（從老大貓嘴上抽走魚乾……）
  const obj = { cat, ball, treat, poo: pooAt(p), litter, tree, box }[kind] || (ch() && ch().obj && ch().obj(kind));
  drag = { kind, obj, id: e.pointerId, hist: [], ox: obj.x - p.x, oy: obj.y - p.y, x0: p.x, y0: p.y, t0: performance.now(), moved: 0 };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (kind === 'cat') { setState('held'); cat.vx = cat.vy = 0; cat.perch = false; cat.in = null; }
  else {
    obj.held = true;
    if (kind === 'poo') obj.buried = 0;                // 被翻出來了：貓又會好奇
    if (kind === 'treat') obj.landed = false;
    if (kind === 'tree' && cat.perch) tumble();        // 搬動貓跳台：上面的貓掉下來
  }
  moveDrag(e);
  document.body.classList.add('grabbing');
});
window.addEventListener('pointermove', e => {
  if (!TAURI) { const p = toWorld(e); mouse.x = p.x; mouse.y = p.y; }
  if (drag && e.pointerId === drag.id) { moveDrag(e); return; }
  if (!TAURI) { stroke(toWorld(e)); setCursor(hitTest(toWorld(e))); }
});
function moveDrag(e) {
  const p = toWorld(e);
  drag.hist.push({ x: p.x, y: p.y, t: performance.now() });
  if (drag.hist.length > 8) drag.hist.shift();
  drag.moved = Math.max(drag.moved, Math.hypot(p.x - drag.x0, p.y - drag.y0));
  const o = drag.obj, k = drag.kind;
  if (k === 'cat') { cat.x = clamp(p.x, 12, W - 12); cat.y = clamp(p.y + 27, 30, FLOOR); }
  else if (k === 'ball') { ball.x = clamp(p.x, ball.r, W - ball.r); ball.y = clamp(p.y, ball.r, FLOOR - ball.r); ball.vx = ball.vy = 0; }
  else if (k === 'treat') { o.x = clamp(p.x, 3, W - 3); o.y = clamp(p.y, -6, FLOOR - 1 - TUBE); o.vx = o.vy = 0; }   // 捏著上面的封口，開口朝下
  else if (k === 'poo') { o.x = clamp(p.x + drag.ox, 3, W - 3); o.y = clamp(p.y + drag.oy, 6, FLOOR); o.vx = o.vy = 0; }
  else { o.x = clamp(p.x + drag.ox, HALF[k], W - HALF[k]); o.y = clamp(p.y + drag.oy, TOP[k], FLOOR); o.vx = o.vy = 0; }   // 家具：抓哪裡就拎哪裡
}
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const h = drag.hist, now = performance.now();
  let vx = 0, vy = 0;
  const old = h.find(q => now - q.t < 100), last = h[h.length - 1];
  if (old && last && last.t > old.t) {                 // 甩的速度：最近 0.1 秒的位移
    vx = (last.x - old.x) / (last.t - old.t) * 16.7;
    vy = (last.y - old.y) / (last.t - old.t) * 16.7;
  }
  const o = drag.obj, k = drag.kind;
  const click = drag.moved < 1.5 && now - drag.t0 < 400;   // 幾乎沒動就放開：當成點一下
  if (k === 'cat') {
    cat.vx = clamp(vx, -3, 3); cat.vy = clamp(vy, -3, 3);
    setState('fall', 999);
  } else if (k === 'ball') {
    ball.held = false;
    ball.vx = clamp(vx, -5, 5); ball.vy = clamp(vy, -5, 5);
    if (Math.hypot(ball.vx, ball.vy) > 0.5) excite();
  } else {
    o.held = false;
    if (k === 'treat') o.y += TUBE;                    // 貓條放開：躺下來掉到地上
    if (click && k === 'poo') scoopAt(o.x, o.y, o);    // 點一下便便：直接鏟掉
    else if (click && k === 'litter') litter.tipped ? rightLitter() : scoopLitter(toWorld(e).x);   // 點一下貓砂盆：鏟便便；翻倒了就翻回來
    else if (click && k === 'box') box.shake = 10;
    else if (click && k === 'tree') { pom[pom.length - 1].px -= 1.5 * pomSide(); goPom(); }   // 撥一下小毛球，貓看到會跑過來玩
    else if (click && ch() && ch().click && ch().click(k)) {}   // 點一下角色的東西（臥推椅：叫牠來練）
    else { o.vx = clamp(vx, -4, 4); o.vy = clamp(vy, -4, 4); }
  }
  drag = null;
  document.body.classList.remove('grabbing');
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

function setQuiet(on) {                                // 系統匣的「安靜模式」
  quiet = on;
  if (quiet && !['held', 'fall', 'pounce', 'leap', 'clutch', 'hop', 'squat', 'cover', 'hide', 'boo', 'away'].includes(cat.state)) setState('sleep', 600);
  if (!quiet && cat.state === 'sleep') setState('sit', 90);
  if (guest && GUEST_PETTABLE.includes(guest.state)) {   // 客人也一起睡、一起醒
    if (quiet) guestSet('sleep', 600);
    else if (guest.state === 'sleep') guestSet('sit', 90);
  }
}

function setFurniture(name, on) {                      // 狀態視窗的「家具」：擺出來或收起來
  const f = FURN[name];
  if (!f || f.on === on) return;
  f.on = on;
  if (drag && drag.obj === f) { drag = null; document.body.classList.remove('grabbing'); }
  f.held = false; f.vx = f.vy = 0; f.y = FLOOR;
  if (name === 'tree') initPom();
  if (on) return;
  if (name === 'litter') { litter.tipped = false; litter.spill = []; }   // 翻倒的盆子收起來，下次擺出來就是立好的
  if (cat.in === name || (name === 'tree' && cat.perch)) tumble();   // 貓在裡面、上面：掉回地上
}

function setToy(t) {                                   // 系統匣的「玩具」
  if (!['ball', 'laser', 'wand'].includes(t) || t === toy) return;
  toy = t; lastPrey = null;
  cat.miss = cat.bored = 0;                            // 換了新玩具，之前搆不到的事就算了
  if (TAURI && t !== 'ball') wandStale = true;
  if (t === 'wand') initWand();
  if (cat.y < FLOOR && ['pounce', 'leap', 'clutch'].includes(cat.state)) { cat.vx = cat.vy = 0; setState('fall', 999); }
  else if (!['sleep', ...BUSY].includes(cat.state)) setState('stare', 40);
}

/* ═══ 串門子：隔壁的貓會來作客，家裡的貓也會去隔壁 ═══
   貓在誰的畫面上，就由誰跑牠的動作；走過邊界時才傳一則訊息交接，另外每秒互相打招呼對帳。
   網頁版用 BroadcastChannel 讓同一個瀏覽器的兩個視窗互當隔壁，貓從靠近對方視窗的那一邊走過去；
   桌寵版由 Rust 在區網上找人、連線（main.rs 的「串門子」、link.rs），訊息一樣，隔壁在哪一邊照狀態視窗的設定。
   訊息：hi（每秒一次：毛色、視窗在螢幕上的位置、安靜模式、我的貓在不在你那邊、我家有沒有你的貓）、
   visit（我的貓走過去了）、home（你的貓走回去了）、recall（我的貓待太久，叫牠回來）、bye（我要關了） */
const COATS = {                                        // 毛色：換掉毛（F）、斑紋（D）、白襪白胸口（W）、眼睛（G）的顏色
  gray: {},                                            // 藍灰虎斑白襪（原本的樣子）
  orange: { F: '#e39a52', D: '#b66d2e', W: '#fbf1e2' },
  tuxedo: { F: '#4a4a58', D: '#3b3b48', G: '#e8c547' },   // 黑白賓士貓
  boss: { F: '#b8693a', D: '#7e4220', W: '#efe2cf', G: '#e0b83c' },   // 老大貓：深一點的橘紅大公貓，臉和魚乾見「老大貓」
  gym: { F: '#ece7dd', D: '#cfc5b3', W: '#ffffff', G: '#6fb2dc' },    // 健身貓：白貓、藍眼睛，頭帶和臥推椅見「健身貓」
};
const pals = {};
const coatPal = k => pals[k] || (pals[k] = { ...C, ...(COATS[k] || {}) });
let myCoat = 'gray', coatPicked = false;               // coatPicked：自己選過毛色（網頁版記在這個分頁裡，重新整理還在）
try { const k = sessionStorage.getItem('yarncat-coat'); if (COATS[k]) { myCoat = k; coatPicked = true; } } catch (_) {}
function nextCoat() {                                  // 換下一種毛色
  const keys = Object.keys(COATS);
  myCoat = keys[(keys.indexOf(myCoat) + 1) % keys.length];
  coatPicked = true;
  try { sessionStorage.setItem('yarncat-coat', myCoat); } catch (_) {}
}

const LINK_V = 1;                                      // 訊息格式的版本：兩邊不一樣就不當隔壁
const ME = Math.random().toString(36).slice(2, 10);   // 這個視窗的代號
let peer = null;                                       // 隔壁 { id, sx, q, hasGuest, seen, odd }：sx 視窗在螢幕上的 x、q 安靜模式、odd 對帳對不上幾次了
let guest = null;                                      // 隔壁來作客的貓
let linkT = 0;                                         // 連線用的時鐘（格）
const chan = !TAURI && window.BroadcastChannel ? new BroadcastChannel('yarncat') : null;   // 網頁版的「連線」
let linkUp = !!chan;                                   // 有沒有線可以說話：網頁版開了頻道就有，桌寵版等 Rust 說連上了
let linkSide = 1;                                      // 桌寵版：隔壁在我的哪一邊（1 右邊、-1 左邊），Rust 照狀態視窗的設定算好送來
if (chan) {
  chan.onmessage = e => onLink(e.data);
  window.addEventListener('pagehide', () => say({ t: 'bye' }));
}
function say(m) {
  if (!linkUp) return;
  m = { ...m, v: LINK_V, id: ME };
  if (chan) chan.postMessage(m); else TAURI.core.invoke('link_send', { msg: m }).catch(() => {});
}
// 隔壁在哪一邊：網頁版看兩個視窗誰左誰右，疊在一起就比代號
const peerSide = () => TAURI ? linkSide : (peer.sx === window.screenX ? ME < peer.id : peer.sx > window.screenX) ? 1 : -1;
// 去隔壁：隔壁在、沒開安靜模式、那邊沒有客人；自己家也沒有客人（有客人就在家陪），還有精神
const canVisit = () => peer && !peer.q && !peer.hasGuest && !guest && cat.energy > 30;

function goAway() {                                    // 整隻走出畫面了：告訴隔壁「我的貓過去了」
  say({ t: 'visit', to: peer.id, coat: myCoat, energy: cat.energy });
  setState('away', 18000);                             // 最多待 5 分鐘
}
function comeHome(energy) {                            // 從隔壁回來：從當初走出去的那一邊走進來
  cat.x = cat.edge > 0 ? W + 16 : -16; cat.y = FLOOR; cat.dir = -cat.edge;
  if (Number.isFinite(energy)) cat.energy = clamp(energy, 0, 100);
  visitCD = rand(28800, 54000);                        // 下一次 8～15 分鐘後
  setState('arrive', 600);
}
function callHome() {                                  // 隔壁不見了、待太久：叫牠回來（隔壁還在的話，請那邊讓客人先離開）
  if (peer) say({ t: 'recall', to: peer.id });
  comeHome();
}
function lostPeer() {                                  // 隔壁關掉了、5 秒沒消息：自己的貓回家，客人也回家
  peer = null;
  if (cat.state === 'away') comeHome();
  if (guest && guest.state !== 'exit') guestSet('exit', 999);
}
function onLink(m) {                                   // 收到隔壁的訊息。桌寵版是從區網上別台電腦送來的，所以每個欄位都要檢查
  if (!m || m.v !== LINK_V || typeof m.id !== 'string' || m.id === ME || (m.to && m.to !== ME)) return;
  if (m.t === 'bye') { if (peer && m.id === peer.id) lostPeer(); return; }
  if (!peer) {                                         // 新的隔壁：第一次串門子 2～4 分鐘後
    if (m.t !== 'hi') return;
    peer = { id: m.id, odd: 0 };
    visitCD = rand(7200, 14400);
  }
  if (m.id !== peer.id) return;                       // 已經有隔壁了，別的視窗不理
  peer.seen = linkT;
  const coat = COATS[m.coat] ? m.coat : 'gray';
  if (m.t === 'hi') {
    Object.assign(peer, { sx: Number(m.sx) || 0, q: !!m.q, hasGuest: !!m.guest });
    if (guest && guest.from === m.id) guest.coat = coat;
    if (!coatPicked && coat === myCoat && ME > m.id) nextCoat();   // 兩隻撞色就換一隻，比較好認
    // 對帳：我以為貓在隔壁，隔壁卻說沒有；或我家有隔壁的貓，隔壁卻說牠在家（訊息掉了、重新整理過）。
    // 交接的訊息可能還在路上，連續 3 次對不上才算數
    const mine = cat.state === 'away' && m.guest !== ME, theirs = guest && guest.from === m.id && m.away !== ME;
    peer.odd = mine || theirs ? peer.odd + 1 : 0;
    if (peer.odd >= 3) {
      peer.odd = 0;
      if (mine) comeHome();
      if (theirs) { poof(guest.x, guest.y - 8); guest = null; }
    }
  } else if (m.t === 'visit') {                       // 隔壁的貓過來了：從那一邊走進來，待 1～3 分鐘
    if (guest) return;                                // 已經有客人了（對帳會讓隔壁把貓叫回去）
    const edge = peerSide();
    guest = { from: m.id, coat, energy: Number.isFinite(m.energy) ? clamp(m.energy, 0, 100) : 80, edge,
      x: edge > 0 ? W + 16 : -16, y: FLOOR, dir: -edge, state: 'enter', t: 0, dur: 999, frame: 0, target: 0,
      stay: rand(3600, 10800) };
  } else if (m.t === 'home') {                        // 我的貓從隔壁走回來了
    if (cat.state === 'away') comeHome(m.energy);
  } else if (m.t === 'recall') {                      // 隔壁把牠的貓叫回去了：那邊已經讓牠從邊邊走進去，這邊的客人就不見了
    if (guest && guest.from === m.id) { poof(guest.x, guest.y - 8); guest = null; }
  }
}
function linkTick() {                                  // 每格：每秒打一次招呼，5 秒沒消息就當隔壁不在了
  if (!linkUp) return;
  linkT++;
  if (linkT % 60 === 0) say({ t: 'hi', coat: myCoat, q: quiet, ...(chan && { sx: window.screenX }),   // 視窗位置只有網頁版用得到
    away: cat.state === 'away' && peer ? peer.id : '', guest: guest ? guest.from : '' });
  if (peer && linkT - peer.seen > 300) lostPeer();
}
function goVisit() {                                   // 狀態視窗按「叫牠去隔壁玩」：在家閒著就馬上出門
  visitCD = 0;
  if (canVisit() && canMeet()) setState('leave', trek(0.6));
}
if (TAURI) {
  TAURI.event.listen('link', ({ payload }) => onLink(payload));
  // 連上、斷線、改了隔壁在哪一邊時送來 { up, side }。斷線就跟隔壁關掉一樣：自己的貓回家，客人也回家
  const setLink = s => {
    if (!s) return;
    linkUp = !!s.up;
    linkSide = s.side < 0 ? -1 : 1;
    if (!linkUp && peer) lostPeer();
  };
  TAURI.event.listen('link-conn', ({ payload }) => setLink(payload));
  TAURI.core.invoke('link_state').then(setLink).catch(() => {});
  TAURI.event.listen('link-go', () => goVisit());
  TAURI.event.listen('call-home', () => { if (cat.state === 'away') callHome(); });
}

/* 客人貓：沿用家裡的貓的姿勢，用牠自己的毛色畫。只會走進來、跟主人家的貓碰鼻子、坐坐、舔毛、走走、打盹，
   待夠了就從原來那一邊走回去；可以摸，不能拎，不用家具。 */
const GUEST_PETTABLE = ['sit', 'lick', 'walk', 'sleep', 'wait', 'pet'];
function guestSet(s, dur = 60) { guest.state = s; guest.t = 0; guest.dur = dur; guest.frame = 0; }
function guestIdle() {                                 // 客人閒著：待夠了（或主人不見了）就回家，不然坐坐、舔毛、走走、打個盹
  const g = guest;
  if (!g.stay || !peer) return guestSet('exit', 999);
  if (quiet) return guestSet('sleep', 600);
  const r = Math.random();
  if (r < 0.35) return guestSet('sit', rand(150, 300));
  if (r < 0.6) return guestSet('lick', rand(90, 150));
  if (r < 0.85) { g.target = rand(20, W - 20); return guestSet('walk', 400); }
  guestSet('sleep', rand(600, 1200));
}
// 主人家的貓能不能過來打招呼：在家、在地上、閒著
const canMeet = () => !quiet && !cat.perch && !cat.in && cat.y >= FLOOR &&
  ['sit', 'lick', 'rest', 'walk', 'stare', 'beg', 'drool', 'dream', 'loaf', 'flop'].includes(cat.state);
function updateGuest() {
  const g = guest;
  if (!g) return;
  g.t++;
  if (g.t % RATE[g.state] === 0) g.frame++;
  g.stay = Math.max(0, g.stay - 1);
  switch (g.state) {
    case 'enter': {                                    // 從隔壁那一邊走進來，停在離邊邊一小段的地方
      const tx = g.edge > 0 ? W - 40 : 40;
      g.x -= g.edge * 0.6;
      if (g.edge > 0 ? g.x <= tx : g.x >= tx) {
        g.x = tx;
        if (canMeet()) { setState('meet', Math.abs(cat.x - g.x) / 0.8 + 120); guestSet('wait', cat.dur); }   // 主人家的貓走過來打招呼
        else guestIdle();
      }
      break;
    }
    case 'wait':                                       // 等主人家的貓走過來
      g.dir = Math.sign(cat.x - g.x) || g.dir;
      if (cat.state !== 'meet' || g.t > g.dur) guestIdle();
      break;
    case 'walk':
      g.dir = Math.sign(g.target - g.x) || g.dir;
      g.x += g.dir * 0.35;
      if (Math.abs(g.target - g.x) < 1 || g.t > g.dur) guestIdle();
      break;
    case 'exit':                                       // 回家：走出畫面，告訴隔壁牠回去了
      g.dir = g.edge;
      g.x += g.edge * 0.6;
      if (g.x > W + 16 || g.x < -16) { say({ t: 'home', to: g.from, energy: g.energy }); guest = null; }
      break;
    case 'pet':                                        // 被摸：瞇眼呼嚕，冒愛心
      if (g.t % 30 === 1) puff('heart', g.x + g.dir * rand(0, 6), g.y - 22);
      if (g.t > g.dur) guestIdle();
      break;
    default:                                           // sit、lick、sleep、boop：時間到了換下一件事
      if (g.t > g.dur) guestIdle();
  }
  if (g.state !== 'enter' && g.state !== 'exit') g.x = clamp(g.x, 12, W - 12);
}
function guestPose(g) {
  const f = g.frame;
  switch (g.state) {
    case 'enter': case 'exit': case 'walk': return standPose(f);
    case 'lick': return lickPose(f);
    case 'sleep': return sleepPose(f);
    case 'pet': return sitPose(f, 'pet');
    case 'boop': return eatPose(f, true);
    case 'wait': return sitPose(f, 'stare');
    default: return sitPose(f, 'sit');
  }
}
function guestBox() {                                  // 客人在哪裡點得到（坐著時照牠面向哪邊左右翻）
  const { x, y, state, dir } = guest;
  if (state === 'sleep') return { x0: x - 12, y0: y - 14, x1: x + 12, y1: y + 1 };
  if (['sit', 'lick', 'pet', 'wait'].includes(state)) return { x0: x - (dir > 0 ? 14 : 11), y0: y - 23, x1: x + (dir > 0 ? 11 : 14), y1: y + 1 };
  return { x0: x - 19, y0: y - 18, x1: x + 19, y1: y + 1 };
}
function drawGuest() {
  const g = guest, [parts, det] = look(guestPose(g), g.coat, 'guest'), ox = Math.round(g.x), oy = Math.round(g.y);
  drawRects(ox, oy, parts, det, g.dir, coatPal(g.coat));
  if (g.state === 'sleep') drawZ(ox + g.dir * 8, oy - 14, g.t);
}
function petGuest() {                                  // 摸客人、點一下客人：瞇眼呼嚕
  if (GUEST_PETTABLE.includes(guest.state) && guest.state !== 'pet') guestSet('pet', 180);
  rub.flips = 0;
}

/* ═══ 狀態視窗（桌寵版）：左鍵點系統匣圖示打開，看貓在做什麼、換毛色、收放家具、選螢幕 ═══
   畫面在 status.html。設定由 Rust 存在 settings.json（毛色、家具、螢幕會記住；玩具、安靜模式不記），
   這裡只照著擺。狀態視窗開著的時候，每半秒把貓現在的樣子送過去：在做什麼、體力、貓砂盆、照現在姿勢畫的小圖。 */
const COAT_NAMES = { gray: '藍灰虎斑', orange: '橘貓', tuxedo: '黑白賓士', boss: '老大', gym: '健身' };
const TOY_NAMES = { ball: '毛球', laser: '雷射光', wand: '逗貓棒' };
function applySettings(s) {                            // 開機時讀一次；之後狀態視窗改了設定，Rust 會再送一次
  if (!s) return;
  if (COATS[s.coat]) { myCoat = s.coat; coatPicked = true; }
  const f = s.furniture || {};
  for (const k of Object.keys(FURN)) if (typeof f[k] === 'boolean') setFurniture(k, f[k]);
  diaryOn = s.diary !== false;
  if (!diaryOn) for (const k of Object.keys(diary)) delete diary[k];   // 關掉了：還沒寫進去的也不要了
}
function doing() {                                     // 貓現在在做什麼
  const prey = { ball: '毛球', laser: '紅點', wand: '羽毛' }[toy];
  const s = cat.state;
  let text = { stare: `盯著${prey}`, chase: `追${prey}`, hunt: `追${prey}`, swipe: `用前掌撥${prey}`, slap: `跳起來拍${prey}` }[s] || ZH[s] || '閒著';
  if (s === 'sleep' && quiet) text = '睡覺（安靜模式）';
  else if (cat.perch && ['sit', 'lick', 'sleep', 'loaf', 'rest'].includes(s)) text = '在貓跳台上' + text;
  return text;
}
// 照姿勢畫一張貓的小圖（不含家具、毛球），回傳 data URL；who：'cat' 自己家的貓（狀態視窗）、'card' 毛色選單（見 look）
function catPicture(coat = myCoat, pose = currentPose(), who = 'cat') {
  const [parts, det, over] = look(pose, coat, who);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y, w, h] of [...parts, ...(over ? over[0] : [])]) { x0 = Math.min(x0, x - 1); y0 = Math.min(y0, y - 1); x1 = Math.max(x1, x + w + 1); y1 = Math.max(y1, y + h + 1); }
  for (const [x, y, w, h] of det)   { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); }
  const c = document.createElement('canvas');
  c.width = x1 - x0; c.height = y1 - y0;
  drawRects(-x0, -y0, parts, det, 1, coatPal(coat), c.getContext('2d'));
  if (over) drawRects(-x0, -y0, over[0], over[1], 1, coatPal(coat), c.getContext('2d'));
  return c.toDataURL();
}
function catStatus() {                                 // 狀態視窗要顯示的東西
  const away = cat.state === 'away';
  return {
    doing: doing(), energy: Math.round(cat.energy),
    poop: litter.on ? litter.poop.length : null, dirty: DIRTY,   // 貓砂盆收起來了就是 null
    coat: myCoat, coatName: COAT_NAMES[myCoat] || myCoat, toy: TOY_NAMES[toy],
    picture: away ? null : catPicture(),               // 去隔壁作客時家裡沒有貓
    away, canVisit: !!canVisit(),                      // 「狀態」分頁的「叫牠回家」「叫牠去隔壁玩」按鈕
  };
}
const coatCards = () => Object.keys(COATS).map(k => ({ id: k, name: COAT_NAMES[k] || k, picture: catPicture(k, sitPose(0, 'sit'), 'card') }));
if (TAURI) {
  let statusTimer = 0;
  const sendStatus = () => TAURI.event.emitTo('status', 'cat-status', catStatus()).catch(() => {});
  TAURI.event.listen('settings', ({ payload }) => applySettings(payload));
  TAURI.event.listen('status-ready', () => {           // 狀態視窗剛載入好：送毛色選單的小圖、現在的狀態過去
    TAURI.event.emitTo('status', 'coat-cards', coatCards()).catch(() => {});
    sendStatus();
  });
  TAURI.event.listen('status-visible', ({ payload }) => {   // Rust 打開、收起狀態視窗時通知：開著才送
    clearInterval(statusTimer);
    statusTimer = payload ? setInterval(sendStatus, 500) : 0;
    if (payload) sendStatus();
  });
  TAURI.core.invoke('get_settings').then(applySettings).catch(() => {});
}

/* ═══ 貓咪日記（桌寵版）：外傳「午睡夢遊記」讀它，讓白天玩了什麼影響晚上的夢 ═══
   只記次數和時間，不記游標、不記圖片。這裡先累積，每分鐘把多出來的交給 Rust 加進
   圖片\YarnCat\diary.json（main.rs 的 diary_add）；狀態視窗「系統」可以關掉。
   欄位（_sec 結尾的是秒數，這裡先用格數記，送出去時才換成秒）：
   toy_ball_sec、toy_laser_sec、toy_wand_sec 跟毛球／雷射光／逗貓棒玩了多久，pets 被摸幾次、purr_sec 呼嚕多久，
   snacks 吃完幾根零食、treats 舔完幾條貓條，big_bubbles 點破幾個大泡泡，quiet_sec 安靜模式多久，
   litter 上幾次廁所、scratch 磨幾次爪、boo 躲紙箱嚇人幾次，flops 搆不到翻肚放棄幾次。
   之後要加欄位直接加；改了欄位的意思才要改 main.rs 的 DIARY_VERSION。 */
let diaryOn = false;                                   // 等設定讀進來才知道（見 applySettings）
const diary = {};                                      // 還沒寫進去的
let diaryBusy = false;                                 // 上一次還沒寫完就不再送
const PLAYING = ['stare', 'chase', 'crouch', 'pounce', 'swipe', 'hunt', 'aim', 'leap', 'clutch', 'slap', 'loaf'];   // 算在「玩玩具」的狀態
function note(k, n = 1) { if (diaryOn) diary[k] = (diary[k] || 0) + n; }
function diaryTick() {                                 // 每格：在玩哪個玩具、在呼嚕、安靜模式，各記一格
  if (!diaryOn || cat.state === 'away') return;        // 去隔壁作客時在別人家玩，不算
  if (PLAYING.includes(cat.state) && !cat.perch) note(`toy_${toy}_sec`);
  if (cat.state === 'pet') note('purr_sec');
  if (quiet) note('quiet_sec');
}
function today() {                                     // 本地時間的 YYYY-MM-DD
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
function diaryFlush() {
  if (!TAURI || !diaryOn || diaryBusy) return;
  const add = {};
  for (const [k, v] of Object.entries(diary)) {
    const n = k.endsWith('_sec') ? Math.floor(v / 60) : v;   // 不滿一秒的留著，下次再送
    if (n > 0) add[k] = n;
  }
  if (!Object.keys(add).length) return;
  diaryBusy = true;
  TAURI.core.invoke('diary_add', { day: today(), add })
    .then(() => { for (const [k, n] of Object.entries(add)) diary[k] -= k.endsWith('_sec') ? n * 60 : n; })
    .catch(() => {})                                   // 寫不進去（例如 OneDrive 正在同步）：留著下一分鐘再送
    .finally(() => { diaryBusy = false; });
}
if (TAURI) setInterval(diaryFlush, 60000);

/* ═══ 角色：有自己個性的貓（老大貓、健身貓……） ═══
   毛色在 COATS；毛色有登記在 CHARS 的，就多了專屬的外觀、動作和東西。主程式只在幾個地方問「現在這隻有沒有自己的」：
     idle()           nextIdle 擲骰子前：要做專屬的事就 setState 並回傳 true
     step()           updateCat 結尾：專屬狀態每一格要做的事
     off()            換成別的毛色時每一格都會叫：把專屬的東西收掉（要能重複叫）
     pose(f)          專屬狀態的姿勢；不是專屬狀態回傳 null
     dress(pose, who) 在任何姿勢上加外觀；who 是 'cat'（自己家的貓）、'guest'（隔壁來的客人）、'card'（毛色選單的小圖）。
                      回傳 [parts, det, over]，over 是畫在貓前面的一層（叼著的魚乾、舉著的槓鈴）
     box()            專屬狀態的點擊範圍；不是回傳 null
     hitFront(p)      比貓優先點到的東西（嘴上的魚乾）；hitBack(p) 比家具後面才點到的東西（臥推椅）。回傳種類名稱或 null
     obj(kind)        拖曳時那個種類對應的物件；grab(kind, p) 按下去那一刻要先做的事；click(kind) 點一下（回傳 true 表示處理了）
     update()         物理（魚乾、臥推椅掉落）；drawBack() 畫在貓後面、drawFront() 畫在貓前面；resize(oldS) 改縮放時
     key(k)           網頁版測試用的按鍵
   專屬物件要拖曳的話，在 HALF、TOP 登記半寬和最高能拎多高，拖曳就照家具的規則走。 */
const CHARS = {};
const ch = () => CHARS[myCoat];
function look(pose, coat, who) {                       // 加上角色外觀
  const c = CHARS[coat];
  return c && c.dress ? c.dress(pose, who) : pose;
}
function charStep() {                                  // updateCat 結尾：現在這隻跑 step，其他角色收掉自己的東西
  for (const [k, c] of Object.entries(CHARS)) {
    if (k === myCoat) { if (c.step) c.step(); }
    else if (c.off) c.off();
  }
}
// 側臉的頭：8 寬、6～7 高的那一塊（正面、翻肚的臉不是）。角色外觀照它的位置加東西
const sideHead = parts => parts.find(([, , w, h, c]) => c === 'F' && w === 8 && (h === 6 || h === 7));
const shift = (rects, dx, dy) => rects.map(r => [r[0] + dx, r[1] + dy, r[2], r[3], r[4]]);

/* ═══ 老大貓：叼著魚乾的大公貓（毛色選「老大」就是牠） ═══
   外觀：沿用每個姿勢，再加腮幫子、缺一角的耳朵、半瞇的眼睛、額頭一道疤（dress）。
   魚乾：走路、坐著、巡視時叼在嘴上；要玩、要睡、被拎起來就先放在地上，忙完再回去叼（CARRY）。
   專屬行為：巡視地盤（patrol）、趴著啃魚乾（gnaw）、你把魚乾拿走就跟著走（wantFish），
   拿太高或太久就坐下來瞪你（glare）；跟客人碰完鼻子，把魚乾留給客人啃（老大請客）。 */
let fish = null;                                       // 放在地上（或被你拿著）的魚乾 { x, y, vx, vy, held, landed, dir }；叼在嘴上時是 null、cat.fish 是 true
cat.fish = false; cat.fishCD = 0; cat.mouth = [7, -14];   // fishCD：多久之內不理魚乾（瞪完你、請完客）；mouth：最後叼著時嘴巴在哪
Object.assign(ZH, { patrol: '巡視地盤', gnaw: '啃魚乾', toFish: '去叼魚乾', grab: '叼起魚乾', wantFish: '跟著魚乾走', glare: '瞪你' });
Object.assign(RATE, { patrol: 14, gnaw: 12, toFish: 9, grab: 8, wantFish: 9, glare: 30 });
PETTABLE.push('patrol', 'gnaw');
HALF.fish = 4; TOP.fish = 4;
// 叼得住魚乾的狀態：站著、坐著、趴著。其他狀態一進去就先把魚乾放下（away：在隔壁作客，魚乾跟著去）
const CARRY = ['sit', 'stare', 'walk', 'patrol', 'rest', 'beg', 'leave', 'away', 'arrive', 'meet', 'toTree', 'toLitter', 'zoom'];
// 你拿著魚乾時，這些狀態會放下手邊的事跟過來
const FISHY = ['sit', 'lick', 'walk', 'stare', 'rest', 'patrol', 'gnaw', 'beg', 'toFish', 'grab'];
function mouthOf(s) {                                  // 叼魚乾時嘴巴在哪（相對腳底正中間，面向右）：坐著、趴著、站著
  if (['sit', 'stare', 'beg', 'glare'].includes(s)) return [7, -14];   // 比嘴巴低一格，魚乾的黑邊才不會蓋到眼睛
  if (s === 'rest') return [9, -8];
  return [12, -9];
}
// 魚乾：(0, 0) 是叼著的那一點，魚頭朝後、魚尾朝前
const FISH_P = [[-2, -1, 6, 3, 'Fb'], [4, -2, 2, 1, 'Fb'], [4, 2, 2, 1, 'Fb']];
const FISH_D = [[0, -1, 3, 1, 'Fl'], [-1, 1, 4, 1, 'Fd'], [-1, -1, 1, 1, 'O']];

function gnawPose(f) {                                 // 趴著，前掌夾著地上的魚乾，頭一點一點地啃
  const b = f % 2;
  const parts = [
    [-15, -3, 4, 2, 'F'],                              // 尾巴
    [-12, -6, 19, 6, 'F'], [-11, -8, 17, 2, 'F'], [-9, -9, 12, 1, 'F'],
    [6, -2, 7, 2, 'F'],                                // 前腳往前伸
    [6, -10 + b, 8, 6, 'F'], [6, -12 + b, 2, 2, 'F'], [11, -12 + b, 2, 2, 'F'],
  ];
  const det = [
    [-7, -9, 1, 3, 'D'], [-4, -9, 1, 3, 'D'], [-1, -9, 1, 2, 'D'], [11, -2, 2, 1, 'W'],
    [10, -7 + b, 4, 3, 'W'], [13, -7 + b, 1, 1, 'P'], [10, -8 + b, 2, 1, 'E'],
    [7, -11 + b, 1, 1, 'P'], [12, -11 + b, 1, 1, 'P'],
  ];
  return [parts, det];
}

function dropFish() {                                  // 嘴上的魚乾放下來（從最後叼著的地方掉下去）
  const [mx, my] = cat.mouth;
  fish = { x: clamp(cat.x + cat.dir * mx, 4, W - 4), y: Math.min(FLOOR, cat.y + my + 2), vx: cat.vx * 0.5, vy: 0, held: false, landed: false, dir: cat.dir };
  cat.fish = false;
}
const fishFree = () => fish && !fish.held && fish.landed;
const fishNear = () => fishFree() && Math.abs(fish.x - (cat.x + cat.dir * 12)) < 6;
function startGnaw() {                                 // 把魚乾放在前掌之間，趴下來啃
  if (!cat.fish) return;
  const at = cat.x + cat.dir * 15;
  if (at < 4 || at > W - 4) cat.dir = -cat.dir;        // 前面頂到畫面邊邊：轉過身再趴
  fish = { x: cat.x + cat.dir * 15, y: FLOOR, vx: 0, vy: 0, held: false, landed: true, dir: cat.dir };
  fish.spot = fish.x;                                  // 放在哪：被撥走、拿走就不啃了
  cat.fish = false;
  setState('gnaw', rand(400, 700));
}
function pickUp() {                                    // 叼起來
  fish = null; cat.fish = true;
  setState(Math.random() < 0.5 ? 'sit' : 'walk', rand(90, 150));
  cat.target = clamp(cat.x + cat.dir * rand(30, 80), 14, W - 14);
}

CHARS.boss = {
  dress(pose, who) {                                   // 老大的臉；自己家的貓叼著魚乾時，魚乾畫在前面那層
    const parts = pose[0].slice(), det = pose[1].slice();
    const head = sideHead(parts);
    if (head) {
      const [hx, hy, , hh] = head;
      const ear = parts.findIndex(([x, y, w, h]) => x === hx && y === hy - 2 && w === 2 && h === 2);
      if (ear >= 0) parts[ear] = [hx, hy - 1, 2, 1, 'F'];   // 後面那隻耳朵缺了上半
      parts.push([hx - 1, hy + 2, 9, hh - 1, 'F']);    // 腮幫子：頭往後、往下多一圈
      for (const [x, y, w, , c] of pose[1])            // 半瞇：眼睛上半蓋一條深色眼皮
        if (c === 'G' && x >= hx && x < hx + 8 && y >= hy && y < hy + hh) det.push([x, y, w, 1, 'D']);
      det.push([hx + 3, hy, 1, 1, 'Sx'], [hx + 4, hy + 1, 1, 1, 'Sx']);   // 額頭往眼睛斜斜一道疤
    }
    const mouth = who === 'card' ? mouthOf('sit') : who === 'cat' && cat.fish && cat.mouth;
    if (!mouth) return [parts, det];
    return [parts, det, [shift(FISH_P, mouth[0], mouth[1]), shift(FISH_D, mouth[0], mouth[1])]];
  },
  pose(f) {
    switch (cat.state) {
      case 'patrol': return standPose(cat.paw ? 0 : f);   // 停下來環顧時腳不動
      case 'gnaw': return gnawPose(f);
      case 'toFish': return standPose(f);
      case 'grab': return eatPose(f, true);
      case 'wantFish': return cat.lv === -2 ? standPose(f) : sitPose(f, 'want');
      case 'glare': return sitPose(f, 'stare');
      default: return null;
    }
  },
  box() {
    const x = cat.x, y = cat.y;
    if (cat.state === 'gnaw') return { x0: x - 16, y0: y - 13, x1: x + 15, y1: y + 1 };
    if (cat.state === 'glare' || (cat.state === 'wantFish' && cat.lv !== -2)) return { x0: x - 14, y0: y - 23, x1: x + 11, y1: y + 1 };
    return null;
  },
  hitFront(p) {                                        // 魚乾：叼著的也抓得到
    if (cat.fish) {
      if (!CARRY.includes(cat.state) || cat.state === 'away') return null;
      const [mx, my] = cat.mouth, fx = cat.x + cat.dir * (mx + 1.5), fy = cat.y + my;
      return Math.abs(p.x - fx) <= 5 && Math.abs(p.y - fy) <= 3 ? 'fish' : null;
    }
    return fish && !fish.held && Math.abs(p.x - fish.x - 1) <= 5 && p.y >= fish.y - 5 && p.y <= fish.y + 1 ? 'fish' : null;
  },
  grab(kind, p) {                                      // 從嘴上抽走魚乾
    if (kind !== 'fish' || !cat.fish) return;
    fish = { x: p.x, y: p.y, vx: 0, vy: 0, held: true, landed: false, dir: cat.dir };
    cat.fish = false;
  },
  obj: kind => kind === 'fish' ? fish : null,
  idle() {                                             // 地上有魚乾先去叼；叼著的話偶爾巡視、啃一啃
    if (fishFree() && !cat.fishCD) { setState('toFish', trek(0.6)); return true; }
    if (!cat.fish || cat.energy < 30) return false;
    const r = Math.random();
    if (r < 0.2) { cat.target = rand(20, W - 20); cat.paw = 0; setState('patrol', trek(0.3)); return true; }
    if (r < 0.32) { startGnaw(); return true; }
    return false;
  },
  off() {                                              // 換成別的毛色：魚乾收掉；正在做老大專屬的事就坐下來，不然會卡住
    if (fish) poof(fish.x, fish.y - 2);
    fish = null; cat.fish = false;
    if (this.pose(0)) setState('sit', 60);
  },
  step() {
    if (!fish && !cat.fish) cat.fish = true;           // 剛換成老大：嘴上叼著一條
    cat.fishCD = Math.max(0, cat.fishCD - 1);
    if (fish && fish.held && !cat.fishCD && !quiet && cat.y >= FLOOR && !cat.perch && FISHY.includes(cat.state)) {
      cat.lv = -2; cat.miss = 0;
      setState('wantFish', 99999);                     // 魚乾被拿走了！
    }
    switch (cat.state) {
      case 'patrol':                                   // 慢慢走，偶爾停下來左右張望
        if (wantTreat()) { goTreat(); break; }
        if (cat.paw) {
          cat.paw--;
          if (cat.paw === 50 || cat.paw === 20) cat.dir = -cat.dir;
          break;
        }
        if (Math.random() < 1 / 240) { cat.paw = 70; break; }
        if (goTo(cat.target, 0.3) || cat.t > cat.dur) setState('sit', rand(120, 200));
        break;

      case 'gnaw':                                     // 啃魚乾：魚乾被拿走、移開了就起來
        if (!fish || fish.held || !fish.landed || Math.abs(fish.x - fish.spot) > 4) { setState('sit', 30); break; }
        if (cat.t % 48 === 24) puff('crumb', fish.x + cat.dir * rand(-1, 2), FLOOR - 3);
        cat.energy = Math.min(100, cat.energy + 0.01);
        if (wantTreat()) goTreat();
        else if (cat.t > cat.dur) { fish = null; cat.fish = true; setState('lick', rand(90, 150)); }   // 啃夠了：叼回嘴上，舔舔嘴
        break;

      case 'toFish': {                                 // 走去地上的魚乾
        if (!fishFree()) { setState('sit', 60); break; }
        const side = Math.sign(cat.x - fish.x) || -cat.dir;
        if (goTo(fish.x + side * 12, 0.6)) { cat.dir = -side; setState('grab', 30); }
        else if (cat.t > cat.dur) setState('sit', 60);
        break;
      }

      case 'grab':                                     // 低頭叼起來
        if (!fishFree()) { setState('sit', 60); break; }
        if (cat.t > cat.dur) fishNear() ? pickUp() : setState('toFish', trek(0.6));
        break;

      case 'wantFish': {                               // 魚乾被你拿著：跟著走到底下，坐著仰頭討
        if (!fish || !fish.held) { setState('sit', 20); break; }
        const tx = clamp(fish.x - cat.dir * 8, 12, W - 12);
        if (Math.abs(fish.x - cat.x) > 3) cat.dir = Math.sign(fish.x - cat.x);
        if (Math.abs(tx - cat.x) > (cat.lv === -2 ? 1 : 10)) {
          cat.lv = -2;
          cat.x += Math.sign(tx - cat.x) * Math.min(0.9, Math.abs(tx - cat.x));
        } else cat.lv = -1;
        if (FLOOR - fish.y > 34) cat.miss++;           // 拿太高，搆不到（跟貓條一樣，超過 34 就只能仰望）
        if (cat.miss > 120 || cat.t > 900) setState('glare', 600);
        break;
      }

      case 'glare':                                    // 坐著瞪你；還回來就去叼，不還就轉過頭不理你
        if (!fish || !fish.held) { setState('sit', 20); break; }
        cat.dir = Math.sign(fish.x - cat.x) || cat.dir;
        if (cat.t > cat.dur) { cat.dir = -cat.dir; cat.fishCD = 1800; setState('sit', rand(240, 360)); }
        break;

      case 'boop':                                     // 跟客人碰鼻子：碰完把魚乾留給客人啃
        if (cat.t === 100 && guest && fishFree() && Math.abs(fish.x - guest.x) < 30) {
          guestSet('boop', 360);
          cat.fishCD = 600;
          puff('heart', cat.x + cat.dir * 4, cat.y - 18);
        }
        break;
    }
    if (guest && guest.state === 'boop' && guest.t > 150 && fishFree() && guest.t % 48 === 24) puff('crumb', fish.x, FLOOR - 3);
    if (cat.fish) {
      if (CARRY.includes(cat.state)) cat.mouth = mouthOf(cat.state);
      else dropFish();
    }
  },
  update() {
    if (!fish || fish.held) return;
    settle(fish, 4, 0.8, 4);
    if (fish.y >= FLOOR) fish.landed = true;
  },
  drawBack() { if (fish && !fish.held) drawRects(Math.round(fish.x), Math.round(fish.y) - 2, FISH_P, FISH_D, fish.dir); },
  drawFront() {
    if (fish && fish.held) drawRects(Math.round(fish.x), Math.round(fish.y) - 2, FISH_P, FISH_D, fish.dir);
    if (cat.state === 'glare' && cat.t % 60 < 45) {    // 瞪你：頭上一閃一閃冒一個生氣的十字（亮 0.75 秒、暗 0.25 秒）
      const x = Math.round(cat.x) + cat.dir * 2, y = Math.round(cat.y) - 27;
      drawRects(x, y, [[0, 1, 1, 1, 'R'], [2, 1, 1, 1, 'R'], [1, 0, 1, 1, 'R'], [1, 2, 1, 1, 'R']], []);
    }
  },
  resize(oldS) {
    if (!fish) return;
    if (S !== oldS) fish.x *= oldS / S;
    fish.x = clamp(fish.x, 4, W - 4);
    if (fish.landed) fish.y = FLOOR;
  },
  key(k) {                                             // p 巡視地盤、f 趴下來啃魚乾
    if (k === 'p' && cat.fish) { cat.target = cat.x < W / 2 ? W - 30 : 30; cat.paw = 0; setState('patrol', trek(0.3)); }
    if (k === 'f') startGnaw();
  },
};

/* ═══ 健身貓：綁紅頭帶的白貓（毛色選「健身」就是牠） ═══
   外觀：沿用每個姿勢，額頭綁一條紅頭帶，腦後垂一小段結（dress）。
   器材：臥推椅、跑步機、高拉背機。只有健身貓的地上才有，挑附近的空地擺；跟家具一樣可以拖、拎高放開會掉下來。
   每隔幾分鐘自己挑一件去練；點一下器材叫牠馬上去練，練的時候再點一下：
     臥推椅（bench）：躺上去、把槓鈴從架子拿下來推幾下（推到底咬緊牙）、放回架子。從側面看，槓鈴是一片圓槓片。
     跑步機（mill）：  站上去原地跑；點一下加速（1～3）。最快撐太久會被往後擠，從尾巴甩出去、落地炸毛。
     高拉背機（lat）： 坐上去伸手抓握把往下拉，配重片跟著升降；點一下加重量（1～3）。最重拉不動，被拉離座椅，鬆手掉下來炸毛。
   練到一半拖動器材、把貓拎起來：貓掉下來，槓鈴回到架子、握把回到頂上。 */
const GEAR = {};                                       // 擺出來的器材 { bench, mill, lat }：{ x, y, vx, vy, held, … }，x 是正中間、y 是底邊
const KINDS = ['bench', 'mill', 'lat'];
const GO = { bench: 'toBench', mill: 'toMill', lat: 'toLat' };   // 走過去的狀態
const USE = { bench: 'press', mill: 'run', lat: 'pull' };       // 在上面練的狀態
const WALK = { toBench: 'bench', toMill: 'mill', toLat: 'lat' };
// 怎麼上去：從器材哪邊走過去（from）、跳到哪（x, y，相對器材）、跳多高（h）。下來也從 from 那邊跳
const MOUNT = { bench: { from: -20, x: -1, y: -8, h: 8 }, mill: { from: -26, x: -4, y: -5, h: 6 }, lat: { from: -20, x: -5, y: -10, h: 8 } };
Object.assign(HALF, { bench: 13, mill: 18, lat: 17 });   // 拉背機的座椅在左邊：半寬放寬，貓坐上去時才不會被擠出畫面
Object.assign(TOP, { bench: 28, mill: 26, lat: 45 });
cat.on = null;                                         // 在哪件器材上（'bench'、'mill'、'lat'）
cat.lift = false; cat.reps = 0;                        // 臥推：槓鈴在手上；這組要推幾下
cat.fast = 0; cat.L = 17; cat.oops = false;            // fast：跑步機最快撐了多久；L：拉背時手臂多長；oops：被甩出去、鬆手掉下來，落地要炸毛
let gymCD = rand(3600, 7200);                          // 還有幾格才想去練（第一次 1～2 分鐘後）
Object.assign(ZH, { toBench: '走去臥推椅', press: '臥推', toMill: '走去跑步機', run: '在跑步機上跑步', toLat: '走去高拉背機', pull: '拉背' });
Object.assign(RATE, { toBench: 9, press: 99, toMill: 9, run: 99, toLat: 9, pull: 99 });   // 99：動畫自己算，不靠 frame
BUSY.push('press', 'run', 'pull');                     // 練到一半，丟毛球、換玩具都不理
// 器材真的被拖走了嗎：按下去還沒怎麼動（可能只是點一下：加速、加重量）不算
const dragged = g => g.held && (!drag || drag.obj !== g || drag.moved >= 1.5);
const gearReady = k => GEAR[k] && !dragged(GEAR[k]) && GEAR[k].y >= FLOOR;

function freeSpot(half) {                              // 在貓附近找一塊空地：不壓到家具和其他器材；擺不下就算了，疊著放
  const taken = [];
  for (const [k, f] of Object.entries(FURN)) if (f.on) taken.push([f.x, HALF[k]]);
  for (const [k, g] of Object.entries(GEAR)) taken.push([g.x, HALF[k]]);
  const ok = x => x >= half && x <= W - half && taken.every(([tx, th]) => Math.abs(x - tx) >= half + th + 6);
  for (let d = 30; d < W; d += 3) for (const s of [1, -1]) { const x = Math.round(cat.x + s * d); if (ok(x)) return x; }
  return clamp(cat.x + 40, half, W - half);
}
function goGear(k) {                                   // 去練（點了器材、或時間到了）
  if (!gearReady(k) || quiet || cat.energy < 30 || cat.perch || cat.in || cat.on) return false;
  if (['sleep', 'pounce', 'leap', 'clutch', ...Object.keys(WALK), ...BUSY].includes(cat.state)) return false;
  setState(GO[k], trek(0.6));
  return true;
}
function leaveGear(k) {                                // 練完：從上來的那一頭跳下來
  const g = GEAR[k];
  cat.lift = false;
  hop(g.x + MOUNT[k].from, FLOOR, 6, 24, () => { cat.on = null; setState('lick', rand(90, 150)); });
}
function dropOff(k) {                                  // 器材被拖走、收起來：貓掉下來，器材回到沒人用的樣子
  cat.on = null; cat.lift = false; cat.fast = 0;
  if (GEAR.mill) GEAR.mill.speed = 1;
  tumble();
}
function oops(vx) {                                    // 被甩出去、鬆手：往後飛，落地炸毛
  cat.on = null; cat.fast = 0;
  cat.vx = vx; cat.vy = -1.6; cat.oops = true;
  bang(cat.x, cat.y - 26);
  setState('fall', 999);
}

/* ── 臥推椅 ── */
// 槓片：(0, 0) 是正中間，側面看是一片圓的，中間是套在槓上的孔
const PLATE_P = [[-3, -2, 7, 5, 'Gp'], [-2, -3, 5, 7, 'Gp']];
const PLATE_D = [[-1, -1, 3, 3, 'Gh'], [0, 0, 1, 1, 'O'], [-2, -2, 1, 1, 'Gl']];
const RACK = [1, -24];                                 // 槓鈴掛在架子上時，槓片的中心（相對椅子）：跟手臂伸直時一樣高，舉起來不用跳
function pressPose(L, strain) {                        // 躺在椅墊上、肚子朝上，兩隻前腳往上撐 L 格；strain：咬緊牙閉眼
  const parts = [
    [-14, -3, 2, 2, 'F'], [-15, -1, 2, 4, 'F'],        // 尾巴從椅子尾巴垂下去
    [-10, -5, 15, 5, 'F'], [-9, -6, 12, 1, 'F'],       // 背貼著椅墊
    [-9, -10, 2, 5, 'F'], [-10, -11, 2, 1, 'F'], [-6, -9, 2, 4, 'F'],   // 後腳彎起來
    [0, -5 - L, 2, L, 'F'], [3, -5 - L, 2, L, 'F'],    // 前腳往上撐
    [5, -7, 9, 6, 'F'], [5, -1, 2, 1, 'F'], [12, -1, 2, 1, 'F'],   // 臉倒過來，耳朵貼著椅墊
  ];
  const det = [
    [-7, -6, 9, 1, 'W'], [-6, -3, 1, 2, 'D'], [-3, -3, 1, 2, 'D'],
    [-10, -11, 2, 1, 'W'], [-6, -9, 2, 1, 'W'], [0, -5 - L, 2, 1, 'W'], [3, -5 - L, 2, 1, 'W'],
    [8, -6, 3, 2, 'W'], [9, -5, 1, 1, 'P'], [5, -1, 1, 1, 'P'], [13, -1, 1, 1, 'P'],
    [5, -3, 9, 1, 'Hb'],                               // 頭帶（臉倒過來，額頭在下面）
  ];
  if (strain) det.push([6, -4, 2, 1, 'E'], [11, -4, 2, 1, 'E'], [9, -6, 1, 1, 'W'], [8, -7, 3, 1, 'O']);   // 閉眼、咬牙
  else det.push([7, -4, 1, 1, 'E'], [11, -4, 1, 1, 'E'], [7, -5, 1, 1, 'G'], [11, -5, 1, 1, 'G']);
  return [parts, det];
}
// 臥推進行到哪：0～20 躺好，20～40 手伸上去拿槓鈴，接著每 50 格推一下，推完 30 格放回架子，再 20 格手放下來
const PRESS_LIE = 20, PRESS_UP = 40, REP = 50;
const pressEnd = () => PRESS_UP + cat.reps * REP + 50;
function armLen() {                                    // 現在手臂往上撐幾格（3 放在胸口、8 伸直）
  const t = cat.t;
  if (t < PRESS_LIE) return 3;
  if (t < PRESS_UP) return 3 + 5 * (t - PRESS_LIE) / (PRESS_UP - PRESS_LIE);
  const r = t - PRESS_UP;
  if (r < cat.reps * REP) return 3 + 5 * (0.5 + 0.5 * Math.cos(2 * Math.PI * r / REP));   // 從伸直放下來到胸口，再推上去
  if (r < cat.reps * REP + 30) return 8;
  return Math.max(3, 8 - 5 * (r - cat.reps * REP - 30) / 20);
}
function stepPress() {
  const g = GEAR.bench;
  cat.x = g.x + MOUNT.bench.x; cat.y = g.y + MOUNT.bench.y; cat.dir = 1;
  const r = cat.t - PRESS_UP;
  if (cat.t === PRESS_UP) cat.lift = true;             // 從架子上拿下來
  if (r === cat.reps * REP + 30) cat.lift = false;     // 放回架子
  if (r >= 0 && r < cat.reps * REP) {
    cat.energy -= 0.03;
    if (cat.t % 37 === 0) sweat(9, -7);
  }
  if (cat.t >= pressEnd()) {
    note('bench_sets'); note('reps', cat.reps);
    sparkle(cat.x + 2, cat.y - 18);                    // 練完一組：亮晶晶
    leaveGear('bench');
  }
}
function drawBench(g) {                                // 臥推椅；槓鈴沒在手上就掛在架子上
  const x = Math.round(g.x), y = Math.round(g.y);
  drawRects(x, y, [
    [-10, -6, 2, 6, 'Gp'], [7, -6, 2, 6, 'Gp'],        // 椅腳
    [5, -26, 2, 18, 'Gp'], [3, -26, 2, 1, 'Gp'],       // 架子、掛鉤
    [-12, -8, 22, 3, 'Bp'],                            // 椅墊
  ], [[-11, -8, 20, 1, 'Bq'], [6, -26, 1, 18, 'Gl']]);
  if (!(cat.state === 'press' && cat.lift)) drawRects(x + RACK[0], y + RACK[1], PLATE_P, PLATE_D);
}

/* ── 跑步機 ── */
const MILL_SPEED = [0, 1, 1.6, 2.4];                   // 每一段速度：腳步多快（倍）
function stepRun() {
  const g = GEAR.mill;
  cat.dir = 1; cat.y = g.y + MOUNT.mill.y;
  g.phase = (g.phase + MILL_SPEED[g.speed] * 0.7) % 30;   // 跑帶往後捲
  cat.energy -= 0.012 * g.speed;
  note('run_sec');
  if (cat.t % Math.round(48 / g.speed) === 0) sweat(10, -14);
  cat.fast = g.speed === 3 ? cat.fast + 1 : 0;
  if (cat.fast > 150) cat.x -= 0.3;                    // 最快撐不住：被往後擠
  else cat.x += (g.x + MOUNT.mill.x - cat.x) * 0.1;    // 慢下來就跑回原位
  if (cat.x < g.x - 14) { g.speed = 1; oops(-1.4); return; }   // 從尾巴甩出去
  if (cat.t > cat.dur && g.speed < 3) { g.speed = 1; note('treadmill'); leaveGear('mill'); }   // 跑夠了（最快的時候下不來）
}
function drawMill(g) {                                 // 跑步機：底座、跑帶（紋路往後捲）、前面的柱子、扶手、小螢幕顯示速度
  const x = Math.round(g.x), y = Math.round(g.y);
  const det = [[13, -22, 1, 19, 'Gl'], [10, -24, 6, 2, 'Gs']];
  for (let i = 0; i < 5; i++) {
    const sx = ((i * 6 - Math.round(g.phase)) % 30 + 30) % 30 - 15;
    det.push([sx, -5, 2, 1, 'Gl']);
  }
  for (let i = 0; i < g.speed; i++) det.push([10 + i * 2, -24, 1, 2, 'Gn']);
  drawRects(x, y, [
    [-17, -3, 34, 3, 'Gp'],                            // 底座
    [-16, -5, 31, 2, 'Tb'],                            // 跑帶
    [12, -22, 2, 19, 'Gp'],                            // 柱子
    [6, -16, 7, 1, 'Gp'],                              // 扶手
    [9, -25, 8, 4, 'Gp'],                              // 螢幕
  ], det);
}

/* ── 高拉背機 ── */
const PULL = 70;                                       // 拉一下幾格
const LAT_REST = -41;                                  // 沒人拉時握把在哪（相對器材，握把頂端）：掛在滑輪底下
function pullPose(L, strain) {                         // 坐在椅墊上，一隻前腳往上抓握把（手臂 L 格長）；仰頭看著握把
  const parts = [
    [-12, -2, 8, 2, 'F'], [-13, -4, 2, 2, 'F'],        // 尾巴
    [-9, -7, 9, 7, 'F'], [-3, -13, 7, 11, 'F'],        // 後腿、胸口
    [-1, -20, 8, 7, 'F'], [-1, -22, 2, 2, 'F'], [4, -22, 2, 2, 'F'],   // 頭、耳朵
    [1, -4, 2, 4, 'F'],                                // 一隻前腳放在腿上
    [5, -12 - L, 2, L, 'F'],                           // 另一隻往上抓握把
  ];
  const det = [
    [1, -11, 3, 6, 'W'], [3, -16, 4, 3, 'W'], [6, -16, 1, 1, 'P'],
    [-7, -7, 1, 3, 'D'], [-4, -7, 1, 3, 'D'], [0, -21, 1, 1, 'P'], [5, -21, 1, 1, 'P'],
    [1, -1, 2, 1, 'W'], [5, -12 - L, 2, 1, 'W'],
  ];
  if (strain) det.push([4, -17, 2, 1, 'E'], [5, -14, 2, 1, 'O']);   // 閉眼咬牙
  else det.push([4, -18, 2, 1, 'E'], [4, -17, 2, 1, 'G']);          // 仰頭看著握把
  return [parts, det];
}
const latBarTop = () => cat.state === 'pull' ? Math.round(cat.y) - 14 - Math.round(cat.L) : null;   // 拉著時握把頂端在哪（世界座標）
function stepPull() {
  const g = GEAR.lat;
  cat.dir = 1; cat.x = g.x + MOUNT.lat.x;
  if (g.weight < 3) {                                  // 拉得動：從手伸直拉到下巴，再放回去
    cat.y = g.y + MOUNT.lat.y;
    const r = cat.t % PULL;
    cat.L = 11 + 6 * Math.cos(2 * Math.PI * r / PULL);
    cat.strain = 0;
    if (r === PULL / 2) note('pulls');                 // 拉到底：算一下
    cat.energy -= 0.01 * (1 + g.weight);
    if (cat.t % 41 === 0) sweat(8, -21);
    if (cat.t > cat.dur && r === 0) { note('lat_sets'); sparkle(cat.x + 3, cat.y - 26); leaveGear('lat'); }
    return;
  }
  cat.L = 17;                                          // 太重了：拉不動，咬牙發抖……
  cat.strain = (cat.strain || 0) + 1;
  if (cat.strain % 30 === 0) sweat(8, -21);
  const up = clamp((cat.strain - 90) / 8, 0, 4);       // ……然後整隻被拉離座椅
  cat.y = g.y + MOUNT.lat.y - up;
  if (cat.strain > 140) { g.weight = 1; cat.strain = 0; oops(-0.8); }   // 鬆手掉下來
}
function drawLat(g) {                                  // 高拉背機：座椅、柱子、頂上的滑輪、鋼索和握把、配重片
  const x = Math.round(g.x), y = Math.round(g.y);
  const top = latBarTop(), barTop = top === null ? y + LAT_REST : top;
  const s = cat.state === 'pull' && g.weight < 3 ? Math.round((17 - cat.L) * 0.7) : 0;   // 拉下來多少，配重片就升多高
  const plates = [];
  for (let i = 0; i < 3; i++) plates.push([11, -4 - (i + 1) * 4 - s, 4, 3, 'Gp']);
  drawRects(x, y, [
    [-12, -2, 28, 2, 'Gp'],                            // 底座
    [-7, -8, 2, 6, 'Gp'], [-11, -10, 10, 2, 'Bp'],     // 座椅
    [8, -44, 3, 42, 'Gp'],                             // 柱子
    [0, -44, 11, 2, 'Gp'],                             // 頂上往前伸出去的橫桿
    ...plates,
  ], [[9, -42, 1, 40, 'Gl'], [-10, -10, 8, 1, 'Bq'], [0, -42, 3, 1, 'Gh'],
    [11, -4 - g.weight * 4 - s, 1, 3, 'Hb']]);       // 插在第幾片的紅插銷：重量
  ctx.fillStyle = C.O;
  ctx.fillRect(x + 1, y - 42, 1, Math.max(0, barTop - (y - 42)));   // 鋼索
  if (top === null) drawRects(x - 1, y + LAT_REST, [[0, 0, 5, 2, 'Gp']], [[1, 0, 3, 1, 'Gl']]);   // 沒人拉：握把掛在頂上
}

function sweat(dx, dy) {                               // 冒汗：一滴藍藍的往旁邊彈出去
  grit(cat.x + cat.dir * dx, cat.y + dy, C.B, rand(-0.4, 0.4), rand(-0.9, -0.4), 30);
}

CHARS.gym = {
  dress(pose, who) {                                   // 紅頭帶；舉著的槓鈴、拉著的握把畫在前面那層
    const parts = pose[0].slice(), det = pose[1].slice();
    const head = sideHead(parts);
    if (head) {
      const [hx, hy, , hh] = head;
      let by = hy + 1;                                 // 綁在眼睛上面一格；頭比較扁（壓低、扒地、炸毛）的姿勢眼睛比較高，跟著往上
      for (const [x, y, , , c] of pose[1])
        if ((c === 'G' || c === 'E') && x >= hx && x < hx + 8 && y >= hy && y < hy + hh) by = Math.max(hy, Math.min(by, y - 1));
      det.push([hx, by, 8, 1, 'Hb']);                  // 額頭一圈
      parts.push([hx - 2, by, 2, 1, 'Hb'], [hx - 3, by + 1, 1, 1, 'Hb']);   // 腦後打結垂下來
    }
    if (who !== 'cat') return [parts, det];
    if (cat.state === 'press' && cat.lift) {           // 槓片在兩隻前掌正上方
      const y = -5 - Math.round(armLen()) - 3;
      return [parts, det, [shift(PLATE_P, 2, y), shift(PLATE_D, 2, y)]];
    }
    if (cat.state === 'pull') {                        // 握把在前掌上面
      const y = -14 - Math.round(cat.L);
      return [parts, det, [[[4, y, 5, 2, 'Gp']], [[5, y, 3, 1, 'Gl']]]];
    }
    return [parts, det];
  },
  pose(f) {
    if (WALK[cat.state]) return standPose(f);
    if (cat.state === 'press') {
      const L = Math.round(armLen()), r = cat.t - PRESS_UP;
      return pressPose(L, cat.lift && r >= 0 && r < cat.reps * REP && L <= 5);   // 推到最低、要往上推的時候最吃力
    }
    if (cat.state === 'run') {
      const g = GEAR.mill, k = MILL_SPEED[g ? g.speed : 1];
      return standPose(Math.floor(cat.t * k / 9));     // 速度越快腳步越快
    }
    if (cat.state === 'pull') {
      const g = GEAR.lat, L = Math.round(cat.L);
      return pullPose(L, (g && g.weight >= 3) || L <= 7);   // 太重、或拉到最底下時咬牙
    }
    return null;
  },
  box() {
    const x = cat.x, y = cat.y;
    if (cat.state === 'press') return { x0: x - 16, y0: y - 16, x1: x + 14, y1: y + 4 };
    if (cat.state === 'run') return { x0: x - 13, y0: y - 17, x1: x + 9, y1: y + 1 };   // 窄一點：前面的螢幕要點得到
    if (cat.state === 'pull') return { x0: x - 14, y0: y - 23, x1: x + 8, y1: y + 1 };
    return null;
  },
  hitBack(p) {                                         // 器材：比家具後面才點得到
    const b = GEAR.bench, m = GEAR.mill, l = GEAR.lat;
    if (b && (inBox(p, { x0: b.x - 13, y0: b.y - 9, x1: b.x + 11, y1: b.y + 1 })
      || inBox(p, { x0: b.x - 3, y0: b.y - 28, x1: b.x + 8, y1: b.y - 8 }))) return 'bench';
    if (m && (inBox(p, { x0: m.x - 18, y0: m.y - 6, x1: m.x + 17, y1: m.y + 1 })
      || inBox(p, { x0: m.x + 5, y0: m.y - 26, x1: m.x + 17, y1: m.y }))) return 'mill';
    if (l && (inBox(p, { x0: l.x - 12, y0: l.y - 11, x1: l.x + 1, y1: l.y + 1 })
      || inBox(p, { x0: l.x + 7, y0: l.y - 45, x1: l.x + 15, y1: l.y + 1 })
      || inBox(p, { x0: l.x - 1, y0: l.y - 45, x1: l.x + 11, y1: l.y - 41 }))) return 'lat';
    return null;
  },
  obj: kind => KINDS.includes(kind) ? GEAR[kind] || null : null,
  click(kind) {                                        // 點一下器材：叫牠來練；正在練的話，跑步機加速、拉背機加重量
    if (!KINDS.includes(kind)) return false;
    const g = GEAR[kind];
    if (kind === 'mill' && cat.state === 'run') g.speed = Math.min(3, g.speed + 1);
    else if (kind === 'lat' && cat.state === 'pull') g.weight = Math.min(3, g.weight + 1);
    else goGear(kind);
    return true;
  },
  idle() {                                             // 時間到了：隨便挑一件擺好的器材去練
    if (gymCD || cat.energy <= 40) return false;
    const ks = KINDS.filter(gearReady).sort(() => Math.random() - 0.5);
    for (const k of ks) if (goGear(k)) { gymCD = rand(10800, 21600); return true; }   // 下一次 3～6 分鐘後
    return false;
  },
  off() {                                              // 換成別的毛色：器材收掉
    for (const k of KINDS) if (GEAR[k]) { poof(GEAR[k].x, GEAR[k].y - 6); delete GEAR[k]; }
    if (cat.on) { cat.on = null; cat.lift = false; cat.fast = 0; tumble(); }
    else if (this.pose(0)) setState('sit', 60);
    cat.oops = false;
  },
  step() {
    for (const k of KINDS) if (!GEAR[k]) {             // 剛換成健身貓：把器材擺在附近的空地
      const x = freeSpot(HALF[k]);
      GEAR[k] = { x, y: FLOOR, vx: 0, vy: 0, held: false, speed: 1, phase: 0, weight: 1 };
      poof(x, FLOOR - 6);
    }
    gymCD = Math.max(0, gymCD - 1);
    if (cat.on && cat.state !== USE[cat.on] && cat.state !== 'hop') {   // 被拎起來、被叫去睡覺（安靜模式）之類的：已經不在器材上了
      const k = cat.on;
      cat.on = null; cat.lift = false; cat.fast = 0;
      if (k === 'mill') GEAR.mill.speed = 1;
      if (!['held', 'fall'].includes(cat.state)) tumble();   // 還留在器材高度的話，先掉下來
    }
    if (cat.oops && !['fall', 'held'].includes(cat.state)) {   // 被甩出去、鬆手掉下來：落地炸毛
      cat.oops = false;
      if (cat.state === 'sit') { cat.dir = 1; setState('spook', rand(70, 100)); }
    }
    const k = WALK[cat.state];
    if (k) {                                           // 走到器材上來的那一頭，跳上去
      const g = GEAR[k], m = MOUNT[k];
      if (!gearReady(k)) setState('sit', 60);
      else if (goTo(g.x + m.from, 0.6)) {
        cat.on = k;
        hop(g.x + m.x, g.y + m.y, m.h, 26, () => {
          if (!gearReady(k) || Math.abs(cat.x - g.x - m.x) > 2) { cat.on = null; return tumble(); }   // 跳到一半器材被搬走了
          cat.dir = 1;
          if (k === 'bench') { cat.lift = false; cat.reps = Math.round(rand(5, 9)); setState('press', 99999); }
          if (k === 'mill') { g.speed = 1; cat.fast = 0; setState('run', rand(600, 1000)); }
          if (k === 'lat') { cat.strain = 0; cat.L = 17; setState('pull', rand(500, 800)); }
        });
      } else if (cat.t > cat.dur) setState('sit', 60);
      return;
    }
    const u = cat.on && cat.state === USE[cat.on] ? cat.on : null;
    if (!u) { cat.lift = false; return; }
    if (!gearReady(u)) return dropOff(u);
    if (u === 'bench') stepPress();
    if (u === 'mill') stepRun();
    if (u === 'lat') stepPull();
  },
  update() {
    for (const k of KINDS) {
      const g = GEAR[k];
      if (g && settle(g, HALF[k], 0.8, TOP[k])) thud(g.x, HALF[k] - 1);
    }
  },
  drawBack() {
    if (GEAR.lat) drawLat(GEAR.lat);
    if (GEAR.mill) drawMill(GEAR.mill);
    if (GEAR.bench) drawBench(GEAR.bench);
  },
  resize(oldS) {
    for (const k of KINDS) {
      const g = GEAR[k];
      if (!g) continue;
      if (S !== oldS) g.x *= oldS / S;
      g.x = clamp(g.x, HALF[k], W - HALF[k]);
      if (!g.held) g.y = FLOOR;
    }
    if (cat.on && cat.state === USE[cat.on]) { const g = GEAR[cat.on], m = MOUNT[cat.on]; cat.x = g.x + m.x; cat.y = g.y + m.y; }
  },
  key(k) {                                             // b 臥推、m 跑步機、l 高拉背機（馬上去練）
    const g = { b: 'bench', m: 'mill', l: 'lat' }[k];
    if (g) { gymCD = 0; goGear(g); }
  },
};
if (!TAURI) window.addEventListener('keydown', e => {   // 網頁版測試用：角色的專屬按鍵（閒著的時候才有用）
  const c = ch();
  if (c && c.key && ['sit', 'lick', 'walk', 'stare', 'rest'].includes(cat.state) && !cat.perch) c.key(e.key);
});

/* ═══ 遊戲迴圈：固定每秒 60 次更新，畫面跟著螢幕刷新 ═══ */
let acc = 0, lastT = performance.now();
function frame(now) {
  acc += Math.min(now - lastT, 100); lastT = now;
  while (acc >= 1000 / 60) {
    if (toy === 'ball') updateBall();
    else if (toy === 'laser') updateLaser();
    else updateWand();
    updateCat();
    updateGuest();
    linkTick();
    updateFurniture();
    if (ch() && ch().update) ch().update();            // 角色的東西：魚乾、臥推椅的物理
    updateFx();
    diaryTick();
    acc -= 1000 / 60;
  }
  ctx.clearRect(0, 0, W, H);
  if (tree.on) drawTree();                             // 家具墊在最底下；貓進了貓砂盆、紙箱，再把前面那片蓋上去
  if (litter.on) drawLitter(false);
  if (box.on) drawBox(false);
  for (const q of poos) drawPoo(Math.round(q.x), Math.round(q.y));
  if (toy === 'ball') { drawRope(); drawBall(); }
  if (snack) drawSnack(Math.round(snack.x) - 3, Math.round(snack.y), snack.bites);
  if (treat && !treat.held) drawTreat();
  if (ch() && ch().drawBack) ch().drawBack();          // 角色的東西：地上的魚乾、臥推椅
  if (guest) drawGuest();                             // 客人畫在家裡的貓後面
  if (cat.state === 'hide') drawPeek(); else drawCat();
  if (litter.on && cat.in === 'litter') drawLitter(true);
  if (box.on && cat.in === 'box') drawBox(true);
  if (treat && treat.held) drawTreat();                // 拿在手上的貓條在貓前面
  if (ch() && ch().drawFront) ch().drawFront();        // 角色的東西：被你拿著的魚乾、老大貓瞪你的十字
  drawScoop();
  drawFx();
  drawBubble();
  if (toy === 'laser') drawLaser();                    // 紅點照在貓身上，所以畫在貓上面
  if (toy === 'wand') drawWand();
  shakeView();
  requestAnimationFrame(frame);
}

resize();
cat.x = W * 0.35; cat.y = FLOOR;
ball.x = W * 0.6; ball.y = FLOOR - ball.r;
tree.x = clamp(W * 0.07, HALF.tree, W - HALF.tree);   // 貓跳台、貓砂盆擺左邊，紙箱擺右邊
litter.x = clamp(W * 0.2, HALF.litter, W - HALF.litter);
box.x = clamp(W * 0.88, HALF.box, W - HALF.box);
tree.y = litter.y = box.y = FLOOR;
initRope();
initPom();
mouse.x = W * 0.7; mouse.y = 8;                        // 還沒收到游標位置前先放這裡
initWand();
started = true;
setState('stare', 60);
window.addEventListener('resize', resize);
watchDpr();
requestAnimationFrame(frame);
</script>
