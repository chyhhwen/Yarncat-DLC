<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毛球貓</title>
<style>
  /* 視窗是透明的：html、body 都不能有背景色 */
  html, body { margin:0; height:100%; overflow:hidden; background:transparent; }
  body { user-select:none; -webkit-user-select:none; }
  canvas { position:absolute; left:0; bottom:0; image-rendering:pixelated; }
  body.grab { cursor:grab; } body.grabbing { cursor:grabbing; } body.poke { cursor:pointer; }
  /* 直接用瀏覽器開這個檔案（不在桌寵視窗裡）時，給個底色方便除錯 */
  body.browser { background:#4b5b72; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* ═══ 世界設定 ═══
   畫面先畫在低解析度的 canvas（100% 縮放時每 3 個螢幕像素 = 1 個遊戲像素），再放大，所以會是像素風。
   以下所有座標、速度都是「遊戲像素」，時間單位是「格」（每秒 60 格）。 */
const BASE = 3;       // 100% 縮放時的放大倍率
let S = BASE;         // 每個遊戲像素佔幾個 CSS 像素，由 pickScale() 決定

/* 125%、150% 縮放時 3 個 CSS 像素 = 3.75、4.5 個實體像素，放大後格子會 4、5、4、5 大小不一。
   所以改成先挑「每個遊戲像素佔幾個實體像素」（取整數），再換回 CSS 像素。 */
function pickScale() {
  const dpr = window.devicePixelRatio || 1;
  return Math.max(1, Math.round(BASE * dpr)) / dpr;
}
const G = 0.15;       // 重力
const strip = document.documentElement;   // 整個視窗就是那條長條
const cv    = document.getElementById('cv');
const ctx   = cv.getContext('2d');
let W = 0, H = 0, FLOOR = 0;

const C = {           // 貓與毛球的顏色（原創的藍灰虎斑白襪貓）
  O: '#262530', F: '#808a9c', D: '#5c6577', W: '#f1eee8', P: '#e79aa5', G: '#9fcf6e', E: '#262530',
  Y: '#d4574e', Yl: '#ee8a7f', Yd: '#a93f37',
  B: '#a8dcff',                                       // 口水
  R: '#ff5a4f',                                       // 驚嘆號
  Lb: '#7cc4b4', Ll: '#ace3d6', Ld: '#579e8f', Ls: '#e6d8b8', Lp: '#c9b48c',   // 貓砂盆、貓砂
  Pb: '#8b5a2f', Pl: '#b4824d', Pd: '#62401f',        // 便便
  K: '#c99a5e', Kl: '#ddb57e', Kd: '#a37744', Ki: '#5e4126',   // 紙箱
  Tc: '#b8afcf', Tl: '#d5cfe6', Td: '#948bad', Ts: '#d4b67c', Tr: '#a88c55', Tp: '#ff8fb1',   // 貓跳台：絨布、麻繩、小毛球
  Cw: '#f7f4ee', Cg: '#c9c4ba', Co: '#f08c3a', Cq: '#e3a35f',   // 貓條：包裝、封口、標籤、肉泥
  Sc: '#f7a8c0', Sd: '#c46a88',                       // 貓砂鏟
  Fb: '#d1a462', Fl: '#ecd29a', Fd: '#9c7440', Sx: '#f2d3b8',   // 老大貓：魚乾、臉上的疤
  Hb: '#e0463c', Gp: '#4a4d5c', Gh: '#8a8fa3', Gl: '#6d7184', Bp: '#3d4a6b', Bq: '#5b6a90',   // 健身貓：頭帶、槓片和鐵架、椅墊
  Tb: '#2f3140', Gs: '#1f3b2f', Gn: '#7be08a',          // 健身貓：跑帶、跑步機螢幕、速度格
};

function resize() {
  const oldS = S, oldFloor = FLOOR;
  S = pickScale();
  W = Math.ceil(strip.clientWidth / S);
  H = Math.ceil(strip.clientHeight / S);
  cv.width = W; cv.height = H;
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  FLOOR = H - 2;
  if (!started) return;                                // 開場時位置還沒擺，下面不用調
  // 游標：有 Rust 回報的實體座標就照新的倍率重算，滑鼠沒動也對得準；瀏覽器測試時照比例換算
  if (TAURI && lastCursor) Object.assign(mouse, cursorToWorld(lastCursor));
  else if (S !== oldS) { mouse.x *= oldS / S; mouse.y *= oldS / S; }
  if (S !== oldS) {                                    // 倍率變了：維持在螢幕上的同一個位置
    cat.x *= oldS / S; ball.x *= oldS / S; ball.y *= oldS / S;
    for (const o of [litter, tree, box, ...poos, ...litter.spill]) o.x *= oldS / S;
    if (treat) treat.x *= oldS / S;
    if (guest) guest.x *= oldS / S;
    initRope(); initWand(); initPom();
  }
  if (!['leave', 'away', 'arrive'].includes(cat.state)) cat.x = clamp(cat.x, 12, W - 12);   // 出門、回家時本來就在畫面外
  if (guest && !['enter', 'exit'].includes(guest.state)) guest.x = clamp(guest.x, 12, W - 12);
  if (cat.state !== 'held') cat.y = cat.y >= oldFloor ? FLOOR : Math.min(cat.y, FLOOR);   // 原本站在地上就繼續站在地上
  ball.x = clamp(ball.x, ball.r, W - ball.r);
  if (snack) {
    if (S !== oldS) snack.x *= oldS / S;
    snack.x = clamp(snack.x, 6, W - 6);
    if (snack.landed) snack.y = FLOOR;
  }
  for (const [o, half] of [[litter, HALF.litter], [tree, HALF.tree], [box, HALF.box], ...poos.map(q => [q, 3])]) {
    o.x = clamp(o.x, half, W - half);                  // 家具、便便也一樣：原本在地上就繼續在地上
    if (!o.held) o.y = o.y >= oldFloor ? FLOOR : Math.min(o.y, FLOOR);
  }
  if (treat) { treat.x = clamp(treat.x, 3, W - 3); if (treat.landed) treat.y = FLOOR; }
  if (ch() && ch().resize) ch().resize(oldS);          // 角色的專屬東西（魚乾、臥推椅）
  if (cat.perch) cat.y = tree.y - PERCH;               // 站在貓跳台上、蹲在貓砂盆裡的，跟著家具的新高度
  else if (cat.in === 'litter' && ['squat', 'cover'].includes(cat.state)) cat.y = litter.y - 5;
}
let started = false;
function watchDpr() {                                  // 改縮放、換到不同縮放的螢幕時重算倍率
  matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`)
    .addEventListener('change', () => { resize(); watchDpr(); }, { once: true });
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand  = (a, b) => a + Math.random() * (b - a);

/* ═══ 毛球：重力、摩擦、反彈 ═══ */
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 4, a: 0, held: false };
const rope = [];      // 線頭：一串用 Verlet 積分模擬的點
const SEG = 2;

function initRope() {
  rope.length = 0;
  for (let i = 0; i < 12; i++) {
    const x = ball.x - i * SEG, y = FLOOR - 0.5;
    rope.push({ x, y, px: x, py: y });
  }
}

function updateBall() {
  if (!ball.held) {
    ball.vy += G;
    ball.x += ball.vx; ball.y += ball.vy;
    const gy = FLOOR - ball.r;
    if (ball.y >= gy) {                               // 碰地：反彈並損失能量
      ball.y = gy;
      ball.vy = Math.abs(ball.vy) > 0.6 ? -ball.vy * 0.45 : 0;
      ball.vx *= 0.975;                               // 地面摩擦
      if (Math.abs(ball.vx) < 0.02) ball.vx = 0;
    } else {
      ball.vx *= 0.998;                               // 空氣阻力
    }
    if (ball.x < ball.r)     { ball.x = ball.r;     ball.vx =  Math.abs(ball.vx) * 0.6; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.6; }
    if (ball.y < ball.r)     { ball.y = ball.r;     ball.vy =  Math.abs(ball.vy) * 0.5; }
  }
  ball.a += ball.vx / ball.r;                         // 滾多遠就轉多少

  // 線頭：第 0 點黏在球的表面，其餘點自由擺動
  rope[0].x = ball.x + Math.cos(ball.a + Math.PI) * ball.r;
  rope[0].y = ball.y + Math.sin(ball.a + Math.PI) * ball.r;
  stepRope(rope, SEG);
}

function stepRope(pts, seg) {                         // 第 0 點由呼叫者固定，其餘點用 Verlet 積分
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i];
    const vx = (p.x - p.px) * 0.98, vy = (p.y - p.py) * 0.98;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy + 0.12;
    if (p.y > FLOOR - 0.5) { p.y = FLOOR - 0.5; p.px = p.x - vx * 0.6; }
  }
  for (let k = 0; k < 4; k++) {                       // 讓每段維持固定長度
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001;
      const diff = (d - seg) / d;
      if (i === 0) { b.x -= dx * diff; b.y -= dy * diff; }
      else { a.x += dx * diff / 2; a.y += dy * diff / 2; b.x -= dx * diff / 2; b.y -= dy * diff / 2; }
    }
  }
}

/* ═══ 雷射光：紅點就照在滑鼠游標的位置 ═══ */
const laser = { x: 0, y: 0 };

function updateLaser() {
  laser.x = mouse.x;
  laser.y = Math.min(mouse.y, FLOOR - 1);              // 照不到地板以下
}

/* ═══ 逗貓棒：棍子握在滑鼠游標上，垂下一條線，末端綁羽毛 ═══ */
const mouse = { x: -99, y: -99 };                      // 游標位置（遊戲像素），視窗外也會更新
const wand = [];
const WSEG = 2.5;

function initWand() {
  wand.length = 0;
  for (let i = 0; i < 9; i++) {
    const x = mouse.x, y = mouse.y + i * WSEG;
    wand.push({ x, y, px: x, py: y });
  }
}
function updateWand() {
  wand[0].x = mouse.x; wand[0].y = mouse.y;
  stepRope(wand, WSEG);
}

/* ═══ 家具：貓砂盆、貓跳台、紙箱 ═══
   都擺在地上，可以拖去別的地方，拎高放開會掉下來（系統匣「家具」可以個別收起來）。
   x 是正中間，y 是底邊。貓砂盆、紙箱分成後面、前面兩半畫，貓進去時夾在中間。 */
const litter = { on: true, x: 0, y: 0, vx: 0, vy: 0, held: false, tipped: false, poop: [], spill: [] };   // poop：盆裡每一坨在哪（相對 x）；spill：翻倒時灑在地上的貓砂
const tree   = { on: true, x: 0, y: 0, vx: 0, vy: 0, held: false };
const box    = { on: true, x: 0, y: 0, vx: 0, vy: 0, held: false, shake: 0 };   // shake：還要抖幾格
const FURN = { litter, tree, box };
const HALF = { litter: 13, tree: 13, box: 12 };        // 半寬：拖的時候不會超出畫面
const TOP  = { litter: 13, tree: 20, box: 18 };        // 拎起來時底邊最高到哪，整個家具才不會超出畫面頂端
const PERCH = 19;                                      // 站在貓跳台平台上時，貓的腳底離地多高
const SWAT = 16;                                       // 撥小毛球一下幾格：前一半舉起前掌，後一半拍下去
const DIRTY = 3;                                       // 盆裡有幾坨就嫌髒、不肯進去
const TIP = 2.3;                                       // 貓砂盆落地速度超過這個就翻倒（大約從 18 格高放開）
const pom = [];                                        // 貓跳台平台邊垂下來的小毛球：一串 Verlet 點
const poos = [];                                       // 掉在地上的便便 { x, y, vx, vy, held, buried }：buried 還有幾格貓才會再理它
let scoop = null;                                      // 鏟子動畫 { x, y, t, take, got }
const litterReady = () => litter.on && !litter.held && !litter.tipped && litter.y >= FLOOR;
const treeReady   = () => tree.on && !tree.held && tree.y >= FLOOR;
const boxReady    = () => box.on && !box.held && box.y >= FLOOR;

function settle(o, half, slide = 0.8, top = 0) {       // 家具、便便、貓條：重力、落地、地面摩擦；回傳落地那一下有多快
  if (o.held) return 0;
  o.vy += G; o.x += o.vx; o.y += o.vy;
  if (o.y < top) { o.y = top; o.vy = Math.abs(o.vy) * 0.5; }   // 往上甩太用力：撞到長條頂端彈回來（跟毛球一樣），不會飛出視窗；top 是底邊最高到哪
  let hit = 0;
  if (o.y >= FLOOR) {
    if (o.vy > 1) hit = Math.hypot(o.vx, o.vy);
    o.y = FLOOR; o.vy = 0;
    o.vx *= slide;
    if (Math.abs(o.vx) < 0.05) o.vx = 0;
  }
  if (o.x < half)     { o.x = half;     o.vx =  Math.abs(o.vx) * 0.4; }
  if (o.x > W - half) { o.x = W - half; o.vx = -Math.abs(o.vx) * 0.4; }
  return hit;
}

function updateFurniture() {
  if (litter.on) {
    const v = settle(litter, HALF.litter, 0.8, TOP.litter);
    if (v > TIP && !litter.tipped) tipLitter();
    else if (v) thud(litter.x, 12);
    if (!litter.tipped && litter.poop.length >= 2 && Math.random() < 1 / 70) stink(litter.x + rand(-8, 8), litter.y - 13);
  }
  if (tree.on) {
    if (settle(tree, HALF.tree, 0.8, TOP.tree)) thud(tree.x, 11);
    pom[0].x = pomX(); pom[0].y = tree.y - 16;
    stepRope(pom, 2);
  }
  if (box.on) {
    if (settle(box, HALF.box, 0.8, TOP.box)) thud(box.x, 12);
    box.shake = Math.max(0, box.shake - 1);
  }
  for (let i = poos.length - 1; i >= 0; i--) {
    const q = poos[i], y0 = q.y;
    settle(q, 3, 0.75, 6);
    if (q.buried) q.buried--;
    if (q.held) continue;
    // 丟進（或掉在）立著的貓砂盆裡：回到盆子裡
    if (litterReady() && Math.abs(q.x - litter.x) < 10 && q.y > litter.y - 10 && (y0 <= litter.y - 10 || q.y >= FLOOR)) {
      litter.poop.push(clamp(Math.round(q.x - litter.x), -9, 8));
      poos.splice(i, 1);
      for (let k = 0; k < 4; k++) grit(q.x, litter.y - 10, C.Ls);
    } else if (q.y >= FLOOR && Math.random() < 1 / 50) stink(q.x + rand(-2, 2), q.y - 5);
  }
  if (treat) {
    settle(treat, 6, 0.85, 4);
    if (!treat.held && treat.y >= FLOOR) treat.landed = true;
    if (treat.landed && treat.paste <= 0) { poof(treat.x, FLOOR - 2); treat = null; }   // 舔完的空袋子：落地就收掉
  }
  updateScoop();
}

function initPom() {
  pom.length = 0;
  for (let i = 0; i < 5; i++) { const x = pomX(), y = tree.y - 16 + i * 2; pom.push({ x, y, px: x, py: y }); }
}

function tipLitter() {                                 // 貓砂盆翻倒：倒扣在地上，貓砂灑一地，便便噴出來
  litter.tipped = true;
  if (cat.in === 'litter') cat.in = null;
  for (const dx of litter.poop)
    poos.push({ x: litter.x + dx, y: litter.y - 10, vx: litter.vx * 0.5 + rand(-1.4, 1.4), vy: rand(-2.4, -1.2), held: false, buried: 0 });
  litter.poop = [];
  litter.spill = [];
  for (const s of [-1, 1]) {                           // 盆子兩邊各堆一小灘，再撒幾粒到遠一點的地方
    const n = Math.round(rand(5, 9));
    for (let i = 0; i < n; i++) litter.spill.push({ x: Math.round(litter.x + s * (14 + i)), h: i < n / 2 ? 2 : 1 });
    for (let i = 0; i < 4; i++) litter.spill.push({ x: Math.round(litter.x + s * rand(15 + n, 30)), h: 1 });
  }
  for (let i = 0; i < 14; i++) grit(litter.x + rand(-11, 11), litter.y - 8, C.Ls);
  thud(litter.x, 13);
  if (!cat.perch && ['sit', 'lick', 'walk', 'rest'].includes(cat.state)) {   // 聽到聲音，轉過去看
    cat.dir = Math.sign(litter.x - cat.x) || cat.dir;
    setState('sit', rand(40, 80));
  }
}
function rightLitter() {                               // 點一下翻倒的盆子：翻回來，灑出來的砂掃回去
  litter.tipped = false;
  litter.spill = [];
  litter.vy = -1.2;
  for (let i = 0; i < 8; i++) grit(litter.x + rand(-12, 12), litter.y - 4, C.Ls);
}

/* 鏟子：從上面插下去、晃一晃、鏟起來就淡掉。take 是要鏟走的那一坨：盆裡的是它的位置（數字），地上的就是那坨便便 */
function scoopAt(x, y, take) {
  if (!scoop) scoop = { x: Math.round(x), y: Math.round(y), t: 0, take, got: false };
}
function scoopLitter(px) {                             // 點貓砂盆：鏟掉離游標最近的那一坨；沒有便便就篩一篩
  let take = null;
  for (const dx of litter.poop) if (take === null || Math.abs(litter.x + dx - px) < Math.abs(litter.x + take - px)) take = dx;
  scoopAt(take === null ? clamp(px, litter.x - 9, litter.x + 8) : litter.x + take, litter.y - 9, take);
}
function updateScoop() {
  if (!scoop) return;
  scoop.t++;
  if (scoop.t === 16) {                                // 鏟到了
    const k = scoop.take;
    if (typeof k === 'number') {
      const i = litter.poop.indexOf(k);
      if (i >= 0 && litter.on && !litter.tipped) { litter.poop.splice(i, 1); scoop.got = true; }
    } else if (k && poos.includes(k) && !k.held) { poos.splice(poos.indexOf(k), 1); scoop.got = true; }
    for (let i = 0; i < 4; i++) grit(scoop.x + rand(-3, 3), scoop.y - 1, C.Ls);
  }
  if (scoop.t > 52) { if (scoop.got) sparkle(scoop.x, scoop.y - 26); scoop = null; }
}

/* ═══ 貓條：系統匣「餵貓條」或想像泡泡掉下來的 ═══
   貓自己打不開，只會坐在旁邊盯著；要抓起來拿到牠嘴邊才舔得到，拿多高牠就低頭、坐著或站起來舔。 */
let treat = null;                                      // { x, y, vx, vy, held, landed, paste }：拿著時 (x, y) 是上面的封口，躺著時是底邊正中間；paste 還剩多少（1 滿、0 舔完）
const TUBE = 12;                                       // 貓條多長
function giveTreat(x = cat.x + cat.dir * 26, y = 0) {  // 掉一條下來（一次只有一條）
  if (treat) return;
  treat = { x: clamp(x, 8, W - 8), y, vx: 0, vy: 0, held: false, landed: false, paste: 1 };
}
function treatTip() {                                  // 擠得出來的那一端：拿著時朝下，躺在地上朝右
  return treat.held ? { x: treat.x, y: treat.y + TUBE } : { x: treat.x + 6, y: treat.y - 2 };
}
const MOUTH = [[13, -5], [7, -15], [7, -20]];          // 舔貓條時嘴巴在哪（相對貓的腳底正中間，面向右）：低頭、坐著、站起來

/* ═══ 貓的大腦：狀態機 ═══ */
// 貓在做什麼（狀態視窗顯示用；盯著、追、撥的是哪個玩具，見 doing()）
const ZH = { sit: '坐著', lick: '舔毛', stare: '盯著毛球', walk: '散步', chase: '追毛球',
  crouch: '壓低準備撲', pounce: '飛撲', swipe: '用前掌撥', sleep: '睡覺', held: '被拎起來', fall: '掉下來',
  hunt: '追毛球', aim: '壓低準備跳', leap: '跳起來撲', clutch: '抓住羽毛吊著', slap: '跳起來拍', loaf: '趴成一條麵包', flop: '翻肚躺著',
  beg: '討摸', drool: '想吃零食', dream: '望著泡泡發呆', pet: '被摸，呼嚕呼嚕', fetch: '去拿零食', eat: '吃零食',
  rest: '趴著休息', hop: '跳', zoom: '暴衝', treat: '舔貓條',
  toLitter: '要去上廁所', squat: '上廁所', cover: '扒砂蓋便便', sniffGo: '去聞便便', sniff: '聞便便', stink: '被臭到', bury: '對著地板扒',
  toBox: '溜進紙箱', hide: '躲在紙箱裡', boo: '蹦出來嚇你', spook: '嚇到炸毛',
  toTree: '走去貓跳台', scratch: '磨爪', toPom: '跑去撥小毛球', pom: '撥小毛球',
  leave: '出門去隔壁', away: '在隔壁作客', arrive: '回家了', meet: '跟客人打招呼', boop: '跟客人碰鼻子' };
const RATE = { sit: 20, lick: 9, stare: 30, walk: 9, chase: 5, crouch: 6, pounce: 99,
  swipe: 14, sleep: 40, held: 10, fall: 10,
  hunt: 5, aim: 6, leap: 99, clutch: 12, slap: 14, loaf: 12, flop: 18,
  beg: 20, drool: 15, dream: 20, pet: 10, fetch: 9, eat: 10,
  rest: 12, hop: 99, zoom: 4, treat: 6, toLitter: 9, squat: 12, cover: 7, sniffGo: 12, sniff: 7, stink: 10, bury: 7,
  toBox: 12, hide: 10, boo: 99, spook: 9, toTree: 9, scratch: 7, toPom: 5, pom: 14,
  leave: 9, away: 99, arrive: 9, meet: 9, boop: 7, enter: 9, exit: 9, wait: 30 };   // 幾格換一張動畫（enter、exit、wait 是客人貓用的）
const cat = { x: 0, y: 0, vx: 0, vy: 0, dir: 1, state: 'sit', t: 0, dur: 60, frame: 0,
  energy: 80, target: 0, high: false, got: false, low: false, up: false,
  miss: 0, bored: 0,                                   // miss：盯著搆不到的東西多久了；bored：放棄後還有多久懶得理它
  perch: false, stay: 0, in: null, jump: null,         // perch：站在貓跳台上（stay 還要待多久）；in：在 'litter' 貓砂盆或 'box' 紙箱裡；jump：正在跳的拋物線
  poo: null, plan: '', scare: false, want: 'snack',    // poo：正在聞的那坨便便；plan：去貓跳台要磨爪還是跳上去；scare：蹦出紙箱是嚇人還是撲毛球；want：想像泡泡裡的零食
  edge: 1,                                             // 串門子：從哪一邊走出去（1 右邊、-1 左邊），回來就從那一邊走進來
  lv: -2, t0: 0, paw: 0, treatCD: 0 };                 // 貓條：lv 姿勢（-2 跑過去、-1 坐旁邊等、0～2 低頭／坐著／站起來舔、3 伸手搆、4 仰望）、t0 開始等的時候、paw 撥一下還剩幾格（撥小毛球也用）、treatCD 等膩了多久不理它
let quiet = false;
let toy = 'ball';                                      // 'ball' 毛球、'laser' 雷射光、'wand' 逗貓棒
const REACH = 44;                                      // 跳起來前掌最高搆得到離地多高
const PATIENCE = 600;                                  // 盯著搆不到的東西超過幾格就可能放棄
const ROLL = 12;                                       // 翻肚前先趴下、翻回來也先趴一下，各幾格
let wishCD = 1800;                                     // 還有幾格才會再冒泡泡（討摸、想吃妙脆角、大泡泡）
let pooCD = rand(10800, 21600);                        // 還有幾格才想上廁所（第一次 3～6 分鐘後）
let boxCD = rand(5400, 10800);                         // 還有幾格才想躲進紙箱
let treeCD = rand(3600, 7200);                         // 還有幾格才想去貓跳台
let pomCD = rand(7200, 14400);                         // 還有幾格才想自己去撥小毛球（第一次 2～4 分鐘後）
let visitCD = rand(7200, 14400);                       // 還有幾格才想去隔壁串門子（有了隔壁才重新算，見 onLink）
// 這些時候貓在忙自己的事：丟毛球、換玩具都不理（後面五個是串門子：出門、不在家、回家、跟客人打招呼）
const BUSY = ['held', 'fall', 'hop', 'pet', 'eat', 'treat', 'squat', 'cover', 'sniff', 'stink', 'bury', 'hide', 'boo', 'spook', 'scratch',
  'leave', 'away', 'arrive', 'meet', 'boop'];

function setState(s, dur = 60) {
  cat.state = s; cat.t = 0; cat.dur = dur; cat.frame = 0;
}
function prey() {                                      // 貓現在盯著的東西在哪
  if (toy === 'laser') return { x: laser.x, y: laser.y };
  if (toy === 'wand') { const e = wand[wand.length - 1]; return { x: e.x, y: e.y }; }
  return { x: ball.x, y: ball.y };
}
let lastPrey = null;
function faceBall() { const d = prey().x - cat.x; if (Math.abs(d) > 1) cat.dir = Math.sign(d); }
function pawHit(p) {                                   // 跳躍中的前掌碰到 p 了嗎？
  if (!cat.high) return Math.hypot(p.x - (cat.x + cat.dir * 12), p.y - (cat.y - 7)) < 6;
  // 往上伸直時整條前腳（離地 12～31）都算
  return Math.abs(p.x - (cat.x + cat.dir * 7)) < 5 && p.y >= cat.y - 31 && p.y <= cat.y - 12;
}
function canReach(p) {                                 // 跳起來搆得到 p 嗎？太高、跑出畫面外都搆不到
  return FLOOR - p.y <= REACH && Math.abs(p.x - clamp(p.x, 12, W - 12)) < 8;
}
function leap(p) {                                     // 朝雷射光／羽毛起跳
  const h = FLOOR - p.y, d = p.x - cat.x;
  cat.high = h > 10;
  if (cat.high) {                                      // 往上跳：跳到最高點時前掌剛好碰到
    cat.vy = -Math.sqrt(2 * G * clamp(h - 26, 3, 20));
    cat.vx = clamp((d - cat.dir * 8) / (-cat.vy / G), -1.6, 1.6);
  } else {                                             // 東西在地上：往前撲
    cat.vy = -1.6;
    cat.vx = clamp((d - cat.dir * 12) / (2 * 1.6 / G), -1.6, 1.6);
  }
  cat.got = false;
  cat.energy -= 3;
  setState('leap', 999);
}
function kick(power, up) {
  ball.vx = cat.dir * power; ball.vy = -up;
  cat.energy -= 5;
}
function excite() {
  if (quiet || ['sleep', 'pounce', ...BUSY].includes(cat.state)) return;
  setState('stare', rand(15, 35));
}

function nextIdle() {                                  // 閒著的時候要做什麼？擲骰子
  if (cat.perch) return perchIdle();
  if (quiet) return setState('sleep', 600);
  if (cat.energy < 20) return treeReady() && Math.random() < 0.4 ? goTree('climb') : setState('sleep', rand(600, 900));   // 睏了：有時候爬到貓跳台上睡
  if (snack && snack.landed) return setState('fetch', 600);   // 地上還有妙脆角沒吃完
  if (wantTreat()) return goTreat();                   // 地上有貓條
  if (!pooCD && litterReady()) return setState('toLitter', trek(0.6));   // 想上廁所
  if (goSniff()) return;                               // 地上有便便：好奇地湊過去聞
  if (!wishCD) {                                       // 冒個泡泡：擲到大泡泡就想著一張圖片，不然就討摸或盯著零食流口水
    wishCD = rand(3600, 9000);                         // 下一次 1～2.5 分鐘後
    if (pic) { const p = pic; pic = null; return dream(p); }
    return Math.random() < 0.5 ? setState('beg', 600) : crave();
  }
  if (!boxCD && boxReady()) { boxCD = rand(10800, 21600); return setState('toBox', trek(0.45)); }   // 偷偷躲進紙箱；下一次 3～6 分鐘後
  if (!treeCD && treeReady()) { treeCD = rand(7200, 18000); return goTree(); }               // 去貓跳台；下一次 2～5 分鐘後
  if (!pomCD && pomSpot() !== null) return setState('toPom', trek(1.1));   // 自己跑去撥小毛球（坐下來開始撥才重新計時）
  if (!visitCD && canVisit()) return setState('leave', trek(0.6));         // 去隔壁串門子（回到家才重新計時）
  if (ch() && ch().idle && ch().idle()) return;        // 角色的專屬動作（老大貓巡視、健身貓臥推……）
  const r = Math.random();
  if (r < (toy === 'ball' ? 0.45 : 0.7) && cat.energy > 30) return setState('stare', rand(40, 90));
  if (r < 0.65) return setState('lick', rand(90, 150));
  if (r < 0.80) { cat.target = rand(14, W - 14); return setState('walk', 400); }
  setState('sit', rand(120, 240));
}

const stinky = () => poos.find(q => !q.held && !q.buried && q.y >= FLOOR);   // 地上有沒有還沒「埋」過的便便
/* 走去家具、便便最多花幾格（逾時就算了）：從畫面一頭走到另一頭的時間再多 2 秒。
   不能寫死：螢幕越寬要走越久，寫死 900 格的話 1920 寬的螢幕上，常常偷偷溜到一半就坐下來不去紙箱了 */
const trek = v => W / v + 120;
function goSniff() {                                   // 地上有還沒埋過的便便：好奇地湊過去聞
  const q = stinky();
  if (!q) return false;
  cat.poo = q;
  setState('sniffGo', trek(0.3));
  return true;
}
const sniffAt = q => clamp(q.x + (Math.sign(cat.x - q.x) || 1) * 15, 12, W - 12);   // 聞便便時站在哪：便便旁邊，鼻子剛好湊到
const wantTreat = () => treat && treat.paste > 0 && (treat.held || (treat.landed && !cat.treatCD));
function goTreat() {                                   // 貓條！在貓跳台上就先跳下來
  if (cat.perch) return hopDown(treat.x);
  cat.lv = -2;
  setState('treat', 99999);
}
function crave() {                                     // 盯著想像泡泡裡的零食流口水：妙脆角或貓條
  cat.want = !treat && Math.random() < 0.5 ? 'treat' : 'snack';
  setState('drool', 600);
}
function goTree(plan = Math.random() < 0.35 ? 'scratch' : 'climb') {   // 去貓跳台：先磨爪，或直接跳上去
  cat.plan = plan;
  setState('toTree', trek(0.6));
}
// 小毛球垂在平台哪一邊：平常在右邊；貓跳台頂著畫面右邊、右邊沒地方坐，就換到左邊（平台畫在 -13～+12，左右對稱是 +11／-12）
const pomSide = () => tree.x + 21 <= W - 12 ? 1 : -1;
const pomX = () => tree.x + (pomSide() > 0 ? 11 : -12);
// 撥小毛球時坐在哪：小毛球那一邊，前掌剛好搆到垂下來的小毛球。貓跳台沒擺好（拎著、還沒落地、收起來）或那邊沒地方坐，就是 null
const pomSpot = () => {
  const at = tree.x + (pomSide() > 0 ? 21 : -22);
  return treeReady() && at >= 12 && at <= W - 12 ? at : null;
};
function goPom() {                                     // 點貓跳台、小毛球晃起來：貓跑過來撥（正在磨爪也會分心）
  if (cat.state === 'pom') { cat.dur = Math.max(cat.dur, cat.t + 300); return; }   // 正在玩：再多玩一會兒
  if (quiet || cat.energy < 20 || cat.state === 'toPom' || pomSpot() === null) return;
  if (cat.state !== 'scratch' && ['sleep', 'pounce', 'leap', 'clutch', ...BUSY].includes(cat.state)) return;
  setState('toPom', trek(1.1));
}
function perchIdle() {                                 // 在貓跳台上閒著：坐著俯瞰、趴著、舔毛、睡覺；待夠了或有事就跳下來
  if (quiet) return setState('sleep', 600);
  if (!cat.stay || wantTreat() || (snack && snack.landed) || (!pooCD && litterReady()) || stinky()) return hopDown();
  if (cat.energy < 20) return setState('sleep', rand(900, 1500));
  const r = Math.random();
  if (r < 0.35) return setState('rest', rand(300, 600));
  if (r < 0.55) return setState('lick', rand(90, 150));
  if (r < 0.7) return setState('sleep', rand(600, 1200));
  setState('sit', rand(150, 300));
}
function goTo(tx, v) {                                 // 往 tx 走，每格最多走 v；走到了回傳 true
  tx = clamp(tx, 12, W - 12);
  const d = tx - cat.x;
  if (Math.abs(d) <= 1) return true;
  cat.dir = Math.sign(d);
  cat.x += cat.dir * Math.min(v, Math.abs(d));
  return false;
}
function hop(x1, y1, h, dur, then) {                   // 跳到 (x1, y1)：拋物線，中間往上拱 h 格；落地後做 then()
  x1 = clamp(x1, 12, W - 12);
  if (Math.abs(x1 - cat.x) > 1) cat.dir = Math.sign(x1 - cat.x);
  cat.jump = { x0: cat.x, y0: cat.y, x1, y1, h, then };
  setState('hop', dur);
}
function climb() {                                     // 跳上貓跳台的平台
  const s = Math.sign(tree.x - cat.x) || cat.dir;
  hop(tree.x + s * 3, tree.y - PERCH, 12, 30, () => {
    if (!treeReady() || Math.abs(cat.x - tree.x) > 10) return tumble();   // 跳到一半貓跳台被搬走了
    cat.perch = true;
    cat.stay = rand(1800, 5400);                       // 待個半分鐘到一分半
    setState(cat.energy < 40 ? 'rest' : 'sit', rand(120, 240));
  });
}
function hopDown(toward = cat.x + cat.dir) {           // 從貓跳台跳下來，往 toward 那一邊
  const s = Math.sign(toward - tree.x) || cat.dir;
  cat.perch = false;
  hop(tree.x + s * 22, FLOOR, 5, 26, () => setState('sit', rand(20, 40)));
}
function tumble() {                                    // 腳下的東西不見了：掉下來
  cat.perch = false; cat.in = null; cat.vx = cat.vy = 0;
  setState('fall', 999);
}
function leaveLitter(done) {                           // 跳出貓砂盆；剛上完常常暴衝一圈，偶爾太用力把盆子踢翻
  const s = cat.dir;
  hop(litter.x + s * 22, FLOOR, 6, 24, () => {
    cat.in = null;
    if (done && !quiet && Math.random() < 0.5) zoom();
    else setState('lick', rand(90, 150));
  });
  if (done && Math.random() < 0.1) { litter.vx = -s * 1.2; tipLitter(); }
}
function zoom() {                                      // 暴衝：全速衝到遠遠的地方
  const s = Math.random() < 0.5 ? -1 : 1;
  let tx = cat.x + s * rand(110, 220);
  if (tx < 14 || tx > W - 14) tx = cat.x - s * rand(110, 220);
  cat.target = clamp(tx, 14, W - 14);
  setState('zoom', 400);
}
function boo(toward, scare = true) {                   // 從紙箱蹦出來！碰到紙箱是嚇你，毛球滾過去是撲出來抓
  cat.dir = Math.sign(toward - box.x) || cat.dir;
  cat.in = 'box'; cat.scare = scare; cat.x = box.x; cat.y = box.y;
  box.shake = 16;
  if (scare) { quake = 12; note('boo'); }
  bang(box.x + cat.dir * 11, box.y - 38);
  setState('boo', scare ? 46 : 10);
}

/* 雷射光、逗貓棒：盯完、趴完、躺完之後下一步做什麼？
   搆得到就追過去、壓低準備跳。搆不到（太高、跑出畫面外）就坐著仰頭看，有時候趴成一條麵包盯著；
   盯太久就放棄，翻肚四腳朝天望著天空。放棄後一陣子，搆不到的東西就懶得理，等它低下來再說。 */
function nextHunt(p, reach) {
  const far = Math.abs(clamp(p.x, 12, W - 12) - cat.x) > 12;   // 比 hunt 停下來的 9 寬一點，差一點點就不起身
  if (reach) return far ? setState('hunt', 600) : setState('aim', FLOOR - p.y > 10 ? rand(8, 20) : rand(12, 30));
  if (cat.bored) return setState('sit', rand(120, 240));
  if (cat.miss > PATIENCE && Math.random() < 0.5) { note('flops'); return setState('flop', rand(300, 600)); }
  if (far) return setState('hunt', 600);               // 先跑到它底下（或畫面邊邊）
  if (Math.random() < 0.4) return setState('loaf', rand(150, 300));
  setState('stare', rand(20, 40));
}

function updateCat() {
  cat.t++;
  if (cat.t % RATE[cat.state] === 0) cat.frame++;
  const p = prey();
  p.vx = lastPrey ? p.x - lastPrey.x : 0;
  p.vy = lastPrey ? p.y - lastPrey.y : 0;
  lastPrey = { x: p.x, y: p.y };
  const d = p.x - cat.x;
  const ballOnGround = ball.y >= FLOOR - ball.r - 1;
  const ballSpeed = Math.hypot(ball.vx, ball.vy);
  const lively = toy === 'ball' ? ballSpeed > 0.8 && Math.abs(d) < 70
                                : Math.hypot(p.vx, p.vy) > 0.6 && Math.abs(d) < 160;
  const reach = toy === 'ball' || canReach(p);         // 毛球都在地上，一定搆得到
  if (!reach && ['stare', 'hunt', 'loaf'].includes(cat.state)) cat.miss++;
  cat.bored = Math.max(0, cat.bored - 1);
  const cd = wishCD;
  wishCD = Math.max(0, wishCD - 1);
  if (cd > PREP && wishCD <= PREP) preparePic();       // 快冒泡泡了：先決定大泡泡還是小泡泡
  pooCD = Math.max(0, pooCD - 1); boxCD = Math.max(0, boxCD - 1); treeCD = Math.max(0, treeCD - 1); pomCD = Math.max(0, pomCD - 1);
  visitCD = Math.max(0, visitCD - 1);
  cat.treatCD = Math.max(0, cat.treatCD - 1);
  if (cat.perch) cat.stay = Math.max(0, cat.stay - 1);

  switch (cat.state) {
    case 'sit': case 'lick': case 'rest':              // rest：趴成一條麵包休息（多半是在貓跳台上俯瞰）
      cat.energy = Math.min(100, cat.energy + 0.005);
      if (wantTreat()) goTreat();
      else if (!cat.perch && !quiet && stinky()) goSniff();   // 便便剛掉到地上（盆子翻倒、被丟過來）：馬上好奇地湊過去，不用等發完呆
      else if (!quiet && cat.energy > 25 && lively && (reach || !cat.bored) && Math.random() < 0.03)
        setState('stare', rand(15, 30));
      else if (cat.t > cat.dur) nextIdle();
      break;

    case 'stare':
      faceBall();
      if (wantTreat()) { goTreat(); break; }
      if (cat.perch) { if (cat.t > cat.dur) hopDown(p.x); break; }   // 在貓跳台上：看夠了就跳下去追
      if (cat.t > cat.dur && !quiet && goSniff()) break;   // 玩到一半發現地上有便便：先去聞（不然要玩到累才會注意到）
      if (toy !== 'ball') {                            // 雷射光、逗貓棒：看夠了就追
        if (cat.t > cat.dur) {
          if (cat.energy > 20) nextHunt(p, reach); else setState('sit', 120);
        }
      } else if (cat.t > cat.dur) {
        if (Math.abs(d) > 13) setState('chase', 480);
        else if (Math.abs(d) < 6 && (cat.x < 14 || cat.x > W - 14)) {   // 球滾到肚子底下、貓又頂著畫面邊邊：撥不到也撲不過去，先往裡面退開一步
          cat.target = clamp(ball.x + (cat.x < W / 2 ? 14 : -14), 12, W - 12);
          setState('walk', 120);
        }
        else if (ballOnGround && ballSpeed < 0.5 && Math.random() < 0.6) setState('swipe', 30);
        else setState('crouch', rand(35, 70));
      }
      break;

    case 'walk': {
      if (wantTreat()) { goTreat(); break; }
      const dd = cat.target - cat.x;
      cat.dir = Math.sign(dd) || cat.dir;
      cat.x += cat.dir * 0.35;
      if (Math.abs(dd) < 1 || cat.t > cat.dur) setState('sit', rand(90, 180));
      break;
    }

    case 'chase':
      faceBall();
      cat.x += cat.dir * 1.05;
      cat.energy -= 0.04;
      // 跑過球的時候會順便把它踢出去
      if (ballOnGround && Math.abs(cat.x + cat.dir * 7 - ball.x) < 4 && Math.sign(ball.vx) !== -cat.dir)
        ball.vx = cat.dir * rand(1.2, 1.8);
      if (cat.energy < 12 || cat.t > cat.dur) setState('sit', 120);
      else if (Math.abs(d) < 12 && ballSpeed < 1.2)
        setState(ballOnGround && Math.random() < 0.55 ? 'swipe' : 'crouch',
                 ballOnGround ? 30 : rand(30, 50));
      break;

    case 'crouch':
      faceBall();
      cat.energy -= 0.01;
      if (cat.t > cat.dur) {
        // 預測落點：起跳到落地大約 2·vy/G 格，順便算進球的移動
        const flight = 2 * 2.0 / G;
        const aim = d + ball.vx * flight * 0.5 - cat.dir * 8;
        cat.vx = clamp(aim / flight, -2, 2);
        if (Math.sign(cat.vx) !== cat.dir || Math.abs(cat.vx) < 0.4) cat.vx = cat.dir * 0.4;
        cat.vy = -2.0;
        setState('pounce', 999);
      }
      break;

    case 'pounce':
      cat.vy += G; cat.x += cat.vx; cat.y += cat.vy;
      if (cat.y >= FLOOR) {
        cat.y = FLOOR; cat.vx = 0; cat.vy = 0;
        const paw = cat.x + cat.dir * 9;
        if (Math.abs(ball.x - paw) < 8 && ball.y > FLOOR - 16) kick(rand(1.6, 3.2), rand(0.8, 2));
        setState('stare', rand(30, 70));
      }
      break;

    case 'swipe':
      if (cat.t === 14) {
        const paw = cat.x + cat.dir * 9;
        if (Math.abs(ball.x - paw) < 7 && ball.y > FLOOR - 14) kick(rand(0.8, 1.6), rand(0.2, 0.8));
      }
      if (cat.t > cat.dur) setState(cat.energy > 25 ? 'stare' : 'sit', rand(40, 80));
      break;

    /* ── 以下是雷射光、逗貓棒用的狀態：追 → 壓低 → 跳起來拍／抓；搆不到就趴著盯、翻肚放棄 ── */
    case 'hunt': {
      faceBall();
      cat.energy -= 0.04;
      const tx = clamp(p.x, 12, W - 12);               // 東西在畫面外時，追到邊邊就好
      if (cat.energy < 12 || cat.t > cat.dur) setState('sit', 120);
      else if (Math.abs(tx - cat.x) > 9 && (reach || !cat.bored))   // 剛放棄過的話，搆不到的就不追了
        cat.x += cat.dir * Math.min(toy === 'laser' ? 1.25 : 1.05, Math.abs(tx - cat.x) - 8);
      else nextHunt(p, reach);
      break;
    }

    case 'aim':
      faceBall();
      cat.miss = cat.bored = 0;                        // 搆得到了，剛才搆不到的事就忘了
      if (Math.abs(d) > 20) setState('hunt', 600);    // 跑掉了，再追
      else if (cat.t > cat.dur) leap(p);
      break;

    case 'leap': {
      cat.vy += G; cat.x += cat.vx; cat.y += cat.vy;
      const landed = cat.y >= FLOOR;
      if (landed) cat.y = FLOOR;                       // 先貼回地板：落地那一格剛好抓到羽毛時，才不會往下多畫一格
      if (!cat.got && pawHit(p)) {
        cat.got = true;
        if (toy === 'wand') { setState('clutch', rand(60, 150)); break; }
      }
      if (landed) {
        cat.vx = cat.vy = 0;
        if (toy === 'laser') setState('slap', 36);    // 雷射光抓不到：落地後按著地板，看看掌心底下有沒有
        else setState('stare', rand(10, 25));
      }
      break;
    }

    case 'clutch': {                                   // 抓住羽毛，被逗貓棒吊著晃
      cat.low = p.y > FLOOR - 14;
      cat.x += (p.x - cat.dir * (cat.low ? 11 : 8) - cat.x) * 0.3;
      const hang = p.y + 28;
      cat.y = cat.low ? FLOOR : Math.min(FLOOR, hang);
      if (Math.hypot(p.vx, p.vy) > 3 || hang < 32 || cat.t > cat.dur) {   // 甩太快、拉太高或玩夠了就鬆手
        cat.vx = cat.vy = 0;
        if (cat.y < FLOOR) setState('fall', 999); else setState('stare', rand(20, 40));
      }
      break;
    }

    case 'slap':
      if (cat.t > cat.dur) setState(cat.energy > 25 ? 'stare' : 'sit', rand(15, 40));
      break;

    case 'loaf':                                       // 趴成一條麵包，盯著搆不到的東西
      if (Math.abs(d) > 16) cat.dir = Math.sign(d);   // 跑到背後才轉過去，在頭頂晃來晃去不用一直轉
      cat.up = p.y < cat.y - 30;
      // 趴穩之後，東西低下來了、跑遠了，或盯夠了：再決定一次
      if (cat.t > 15 && (reach || Math.abs(clamp(p.x, 12, W - 12) - cat.x) > 32 || cat.t > cat.dur)) nextHunt(p, reach);
      break;

    case 'flop':                                       // 放棄了：翻肚四腳朝天，望著天空
      cat.energy = Math.min(100, cat.energy + 0.005);
      if (reach && Math.abs(d) < 64 && cat.t < cat.dur - ROLL) cat.dur = cat.t + ROLL;   // 又低下來了：翻回來去抓
      if (cat.t > cat.dur) {
        cat.miss = 0;
        if (reach) nextHunt(p, reach);
        else {
          cat.bored = rand(1800, 3600);                // 還是搆不到：接下來一陣子懶得理它
          if (cat.energy < 30 || Math.random() < 0.2) setState('sleep', rand(600, 900));   // 躺著躺著就睏了
          else setState('lick', rand(90, 150));       // 若無其事地舔舔毛
        }
      }
      break;

    case 'sleep':
      cat.energy = Math.min(100, cat.energy + 0.15);
      if (!quiet && treat && treat.held && treat.paste > 0 && Math.abs(treat.x - cat.x) < 60) setState('sit', 10);   // 貓條拿到旁邊：醒了
      else if (!quiet && cat.t > cat.dur && cat.energy > 90) setState('sit', 120);
      break;

    /* ── 泡泡：討摸、想吃妙脆角、望著大泡泡裡的圖片發呆。點泡泡（或在貓身上來回摸）就有反應，沒理牠就算了 ── */
    case 'beg': case 'drool': case 'dream':
      if (cat.t > cat.dur) setState('sit', rand(60, 120));
      break;

    case 'pet':                                        // 被摸：瞇眼呼嚕，冒愛心
      cat.energy = Math.min(100, cat.energy + 0.02);
      if (cat.t % 30 === 1) puff('heart', cat.x + cat.dir * rand(0, 6), cat.y - 22);
      if (cat.t > cat.dur) quiet ? setState('sleep', 600) : setState('sit', rand(90, 150));
      break;

    case 'fetch': {                                    // 走去妙脆角旁邊
      if (!snack) { setState('sit', 60); break; }
      cat.dir = Math.sign(snack.x - cat.x) || cat.dir;
      const tx = clamp(snack.x - cat.dir * 15, 12, W - 12);
      if (Math.abs(tx - cat.x) > 1) cat.x += Math.sign(tx - cat.x) * Math.min(0.8, Math.abs(tx - cat.x));
      else if (snack.landed) { cat.dir = Math.sign(snack.x - cat.x) || cat.dir; setState('eat', 200); }
      if (cat.t > cat.dur) setState('sit', 60);
      break;
    }

    case 'eat':                                        // 喀滋喀滋，一口一口咬
      if (!snack) { setState('lick', rand(120, 180)); break; }
      if (cat.t % 60 === 30) {
        snack.bites++;
        for (let i = 0; i < 4; i++) puff('crumb', snack.x + rand(-2, 2), FLOOR - 3);
        if (snack.bites >= 3) { snack = null; cat.energy = Math.min(100, cat.energy + 20); note('snacks'); }
      }
      if (cat.t > cat.dur) setState('lick', rand(120, 180));   // 吃完舔舔嘴
      break;

    case 'held':
      break;                                           // 位置由滑鼠決定

    case 'fall': {
      cat.vy += G; cat.x += cat.vx; cat.y += cat.vy;
      const top = tree.y - PERCH, rim = box.y - 16;
      if (treeReady() && cat.vy > 0 && Math.abs(cat.x - tree.x) < 12 && cat.y >= top && cat.y - cat.vy <= top + 8) {
        cat.y = top; cat.vx = cat.vy = 0;              // 掉在貓跳台的平台上（差一點點也會攀上去）
        cat.perch = true; cat.stay = rand(1800, 5400);
        setState(quiet ? 'sleep' : 'sit', 90);
        break;
      }
      if (boxReady() && cat.vy > 0 && Math.abs(cat.x - box.x) < 8 && cat.y >= rim && cat.y - cat.vy <= rim + 6) cat.in = 'box';   // 掉進紙箱口
      if (cat.y >= FLOOR) {
        cat.y = FLOOR; cat.vx = cat.vy = 0;
        if (cat.in === 'box') { cat.x = box.x; setState('hide', rand(1800, 3600)); }   // 丟進紙箱：就躲在裡面
        else setState(quiet ? 'sleep' : 'sit', 90);
      }
      break;
    }

    /* ── 以下是家具、貓條用的狀態 ── */
    case 'hop': {                                      // 跳上跳下：跳上貓跳台、跳進跳出紙箱和貓砂盆
      const j = cat.jump, k = Math.min(1, cat.t / cat.dur);
      cat.x = j.x0 + (j.x1 - j.x0) * k;
      cat.y = j.y0 + (j.y1 - j.y0) * k - 4 * j.h * k * (1 - k);
      if (k >= 1) j.then();
      break;
    }

    case 'zoom':                                       // 暴衝：一路衝到另一頭
      if (goTo(cat.target, 2.1) || cat.t > cat.dur) setState('sit', rand(60, 120));
      break;

    case 'toTree': {                                   // 走去貓跳台：先站起來磨爪，或直接跳上去
      if (!treeReady()) { setState('sit', 60); break; }
      const side = Math.sign(cat.x - tree.x) || 1;
      if (goTo(tree.x + side * (cat.plan === 'scratch' ? 9 : 20), 0.6)) {
        cat.dir = -side;
        if (cat.plan === 'scratch') { setState('scratch', rand(120, 200)); note('scratch'); } else climb();
      } else if (cat.t > cat.dur) setState('sit', 60);
      break;
    }

    case 'scratch':                                    // 抓柱子磨爪，抓下一點麻繩屑
      if (!treeReady()) { setState('sit', 60); break; }
      if (cat.t % 14 === 7) grit(tree.x - cat.dir * 2, tree.y - rand(10, 15), C.Ts, -cat.dir * rand(0.1, 0.5), 0, 30);
      if (cat.t > cat.dur) !quiet && Math.random() < 0.6 ? climb() : setState('lick', rand(90, 150));
      break;

    case 'toPom': {                                    // 小毛球晃起來了：跑到貓跳台旁邊小毛球那一邊
      if (wantTreat()) { goTreat(); break; }
      const at = pomSpot();
      if (at === null) setState('sit', 60);            // 貓跳台被拿走了
      else if (goTo(at, 1.1)) {                        // 坐下來面向小毛球；不管是被點過來還是自己來的，都要再過 4～8 分鐘才會自己想撥
        cat.dir = -pomSide(); cat.paw = 0; pomCD = rand(14400, 28800);
        setState('pom', rand(300, 600));
      }
      else if (cat.t > cat.dur) setState('sit', 60);
      break;
    }

    case 'pom': {                                      // 坐在小毛球旁邊盯著它晃：盪回來就伸手拍，停下來了也拍拍看
      if (wantTreat()) { goTreat(); break; }
      const at = pomSpot();
      if (at === null) { setState('sit', 60); break; }
      if (Math.abs(at - cat.x) > 2) { setState('toPom', trek(1.1)); break; }   // 貓跳台被推走了：跟過去
      cat.energy -= 0.02;
      const e = pom[pom.length - 1], vx = e.x - e.px;
      if (cat.paw) {
        cat.paw--;
        if (cat.paw === SWAT / 2 && Math.abs(e.x - (cat.x + cat.dir * 8)) < 5 && e.y > cat.y - 12)
          e.px = e.x - cat.dir * rand(1.2, 1.8);       // 拍中了：盪回貓跳台那邊
      } else if (cat.t > cat.dur || cat.energy < 15) setState(Math.random() < 0.5 ? 'lick' : 'sit', rand(90, 150));   // 玩夠了
      else if (Math.random() < (vx * cat.dir < -0.05 ? 0.06 : Math.abs(vx) < 0.05 ? 0.02 : 0)) cat.paw = SWAT;   // 連拍幾下，偶爾停下來盯著看
      break;
    }

    case 'toLitter': {                                 // 想上廁所：走到貓砂盆旁邊，跳進去
      if (!litterReady()) { setState('sit', 60); break; }
      const side = Math.sign(cat.x - litter.x) || 1;
      if (goTo(litter.x + side * 22, 0.6)) {
        cat.dir = -side;
        if (litter.poop.length >= DIRTY) { cat.poo = null; setState('sniff', rand(60, 90)); }   // 太髒了：聞一聞就不肯進去
        else { cat.in = 'litter'; hop(litter.x - side * 2, litter.y - 5, 7, 26, () => setState('squat', rand(200, 280))); }
      } else if (cat.t > cat.dur) setState('sit', 60);
      break;
    }

    case 'squat':                                      // 蹲在盆裡用力
      if (!litterReady()) { leaveLitter(false); break; }
      if (cat.t > cat.dur) {
        litter.poop.push(clamp(Math.round(cat.x - cat.dir * 9 - litter.x + rand(-2, 2)), -9, 8));   // 便便在尾巴底下
        pooCD = rand(36000, 72000);                    // 下一次 10～20 分鐘後
        note('litter');
        cat.dir = -cat.dir;                            // 轉過身扒砂蓋起來
        setState('cover', rand(110, 170));
      }
      break;

    case 'cover':                                      // 扒貓砂把便便蓋起來
      if (!litterReady()) { leaveLitter(false); break; }
      if (cat.t % 14 === 7) for (let i = 0; i < 3; i++) grit(cat.x + cat.dir * 9, litter.y - 10, C.Ls, cat.dir * rand(0.2, 0.9), rand(-1.6, -0.8));
      if (cat.t > cat.dur) leaveLitter(true);
      break;

    case 'sniffGo': {                                  // 好奇：遠的話先走過去，最後一段壓低身體慢慢湊過去
      const q = cat.poo;
      if (!q || !poos.includes(q) || q.held) { setState('sit', 60); break; }
      const tx = sniffAt(q);
      if (goTo(tx, Math.abs(tx - cat.x) > 40 ? 0.6 : 0.3)) { cat.dir = Math.sign(q.x - cat.x) || cat.dir; setState('sniff', rand(70, 110)); }
      else if (cat.t > cat.dur) setState('sit', 60);
      break;
    }

    case 'sniff':                                      // 鼻子湊過去聞一聞……
      if (cat.poo && (!poos.includes(cat.poo) || cat.poo.held)) { setState('sit', 60); break; }   // 被鏟走、被拿走了
      if (cat.t > cat.dur) {
        setState('stink', 60);
        for (let i = 0; i < 3; i++) stink(cat.x + cat.dir * rand(8, 12), cat.y - rand(10, 14));
      }
      break;

    case 'stink':                                      // ……好臭！皺著臉往後縮
      if (cat.t > cat.dur) setState('bury', rand(160, 240));
      break;

    case 'bury':                                       // 對著地板扒呀扒，想把它埋起來（地板當然埋不了）
      if (cat.t % 14 === 7) grit(cat.x + cat.dir * 10, FLOOR - 1, '#d9d4c7', cat.dir * rand(0.1, 0.4), rand(-0.5, -0.2), 16);
      if (cat.t > cat.dur) {
        const q = cat.poo;
        if (!q) pooCD = rand(18000, 36000);            // 嫌貓砂盆髒：過 5～10 分鐘再來看看
        else if (poos.includes(q) && !q.held) q.buried = rand(7200, 14400);   // 牠覺得埋好了，2～4 分鐘內不再理它
        cat.target = clamp(cat.x - cat.dir * rand(50, 90), 14, W - 14);   // 若無其事地走開
        setState('walk', 400);
      }
      break;

    case 'toBox': {                                    // 偷偷摸摸地溜到紙箱旁邊，跳進去
      if (!boxReady()) { setState('sit', 60); break; }
      const side = Math.sign(cat.x - box.x) || 1;
      if (goTo(box.x + side * 20, 0.45)) {
        cat.dir = -side; cat.in = 'box';
        hop(box.x, box.y, 10, 28, () => setState('hide', rand(2400, 4800)));
      } else if (cat.t > cat.dur) setState('sit', 60);
      break;
    }

    case 'hide': {                                     // 躲在紙箱裡：偶爾探出耳朵眼睛，紙箱抖一下
      cat.x = box.x; cat.y = box.y;
      const nap = quiet || cat.energy < 30;            // 睏了（或安靜模式）就在裡面睡
      cat.energy = Math.min(100, cat.energy + (nap ? 0.15 : 0.005));
      if (!nap && cat.t % 240 === 120 && Math.random() < 0.6) box.shake = 14;
      if (!nap && toy === 'ball' && cat.t > 120 && ballSpeed > 0.8 && Math.abs(ball.x - box.x) < 36) boo(ball.x, false);   // 毛球滾過去：撲出來抓
      else if (!quiet && (cat.t > cat.dur || (!nap && wantTreat()))) {   // 躲夠了自己出來；有貓條也出來（往貓條那邊跳）
        if (wantTreat()) cat.dir = Math.sign(treat.x - box.x) || cat.dir;
        hop(box.x + cat.dir * 20, FLOOR, 10, 28, () => { cat.in = null; setState('sit', rand(60, 120)); });
      }
      break;
    }

    case 'boo':                                        // 碰！蹦出紙箱、舉高雙手嚇你，定格一下再跳出來
      cat.x = box.x;
      cat.y = box.y - Math.round(13 * Math.sin(Math.min(1, cat.t / 6) * Math.PI / 2));
      if (cat.t >= cat.dur) hop(box.x + cat.dir * 24, FLOOR, 8, 24, () => {
        cat.in = null;
        if (cat.scare) setState('spook', rand(70, 100)); else setState('stare', rand(10, 20));
      });
      break;

    case 'spook': {                                    // 嚇完：弓背炸毛，側著蹦蹦跳
      const k = cat.t % 18;
      cat.y = FLOOR - (k < 10 ? Math.round(Math.sin(k / 10 * Math.PI) * 3) : 0);
      if (k < 10) cat.x -= cat.dir * 0.3;
      if (cat.t > cat.dur) { cat.y = FLOOR; quiet ? setState('sleep', 600) : Math.random() < 0.6 ? zoom() : setState('sit', rand(60, 120)); }
      break;
    }

    case 'treat': {                                    // 貓條！跑過去；拿在手上就舔，躺在地上就坐在旁邊盯著
      if (!treat || treat.paste <= 0) { setState('lick', rand(150, 210)); break; }
      if (!treat.held) {
        if (!treat.landed) break;                      // 還在掉
        const side = Math.sign(cat.x - treat.x) || 1, tx = clamp(treat.x + side * 16, 12, W - 12);
        if (cat.lv !== -1) { if (goTo(tx, 1.1)) { cat.lv = -1; cat.dir = Math.sign(treat.x - cat.x) || -side; cat.t0 = cat.t; } break; }
        if (Math.abs(tx - cat.x) > 6) { cat.lv = -2; break; }   // 被撥遠了：再走過去
        cat.paw = Math.max(0, cat.paw - 1);
        if ((cat.t - cat.t0) % 160 === 100) { cat.paw = 16; treat.vx = cat.dir * 0.4; }   // 打不開，用前掌撥撥看
        if (cat.t - cat.t0 > 1500) { cat.treatCD = rand(1800, 3600); setState('sit', 60); }   // 等了 25 秒沒人理：先去做別的
        break;
      }
      const tip = treatTip(), h = FLOOR - tip.y;
      const lv = h <= 10 ? 0 : h <= 18 ? 1 : h <= 25 ? 2 : h <= 34 ? 3 : 4;   // 3：站起來伸手搆，4：太高了，只能坐著仰望
      if (Math.abs(tip.x - cat.x) > 3 && Math.sign(tip.x - cat.x) !== cat.dir) cat.dir = Math.sign(tip.x - cat.x);
      const off = tip.x - cat.dir * (lv <= 2 ? MOUTH[lv][0] : 6) - cat.x;
      if (Math.abs(off) > (cat.lv === -2 ? 1 : 6)) {   // 離太遠：跑過去
        cat.lv = -2;
        cat.x += Math.sign(off) * Math.min(1.2, Math.abs(off));
        break;
      }
      cat.x += clamp(off, -0.3, 0.3);                  // 差一點點：挪一挪就好
      cat.lv = lv;
      if (lv > 2) break;
      const [mx, my] = MOUTH[lv];
      if (Math.abs(cat.x + cat.dir * mx - tip.x) > 3 || Math.abs(cat.y + my - tip.y) > 5) break;
      treat.paste -= 1 / 420;                          // 舔得到：大約 7 秒舔完
      if (cat.t % 45 === 0) puff('heart', cat.x + cat.dir * rand(0, 6), cat.y + my - 6);
      if (cat.t % 40 === 20) grit(tip.x, tip.y + 1, C.Cq, rand(-0.2, 0.2), 0, 30);   // 滴下來一點肉泥
      if (treat.paste <= 0) {                          // 舔完了：心滿意足舔舔嘴
        treat.paste = 0;
        cat.energy = Math.min(100, cat.energy + 25);
        note('treats');
        for (let i = 0; i < 3; i++) puff('heart', cat.x + cat.dir * rand(-2, 8), cat.y + my - rand(4, 10));
        setState('lick', rand(150, 210));
      }
      break;
    }

    /* ── 以下是串門子用的狀態：去隔壁、不在家、回家、跟隔壁來的客人碰鼻子 ── */
    case 'leave':                                      // 去隔壁：往隔壁那一邊一路走出畫面
      if (!peer) { setState('arrive', 600); break; }   // 隔壁不見了：走回來
      if (wantTreat() && cat.x > 12 && cat.x < W - 12) { goTreat(); break; }   // 還沒走出去就有貓條：先吃
      cat.edge = cat.dir = peerSide();
      cat.x += cat.dir * 0.6;
      if (cat.x > W + 16 || cat.x < -16) goAway();
      else if (cat.t > cat.dur) setState('sit', 60);
      break;

    case 'away':                                       // 在隔壁作客：這邊沒有貓，等隔壁說牠回來了
      if (!peer || cat.t > cat.dur) callHome();        // 隔壁不見了，或待太久（隔壁的畫面可能沒在動）：叫牠回來
      break;

    case 'arrive':                                     // 從隔壁回來：從邊邊走進畫面
      if (goTo(clamp(cat.x, 36, W - 36), 0.6)) setState(Math.random() < 0.5 ? 'lick' : 'sit', rand(90, 150));
      break;

    case 'meet': {                                     // 隔壁的貓來了：走過去打招呼
      if (!guest || guest.state !== 'wait') { setState('sit', 60); break; }
      const s = -guest.edge;                           // 從靠畫面裡面的那一側過去，兩隻才都在畫面裡
      if (goTo(guest.x + s * 26, 0.8)) {               // 站到鼻子剛好碰到的地方
        cat.dir = -s; guest.dir = s;
        setState('boop', 150); guestSet('boop', 150);
      } else if (cat.t > cat.dur) setState('sit', 60);
      break;
    }

    case 'boop':                                       // 碰鼻子：聞一聞，冒愛心
      if (!guest || cat.t > cat.dur) { setState(Math.random() < 0.5 ? 'sit' : 'lick', rand(90, 150)); break; }
      if (cat.t % 40 === 20) puff('heart', (cat.x + guest.x) / 2 - 1, cat.y - 16);
      break;

  charStep();                                          // 角色的專屬狀態；換了毛色就把上一個角色的東西收掉
  if (!['leave', 'away', 'arrive'].includes(cat.state)) cat.x = clamp(cat.x, 12, W - 12);   // 出門、回家時會走到畫面外
  cat.energy = clamp(cat.energy, 0, 100);
}

function standUpPose() {                               // 坐在後腿上把身體立起來、前掌縮在胸前：舔拿得高高的貓條
  const parts = [
    [-12, -2, 8, 2, 'F'],                              // 尾巴撐在地上
    [-7, -8, 9, 8, 'F'], [1, -2, 3, 2, 'F'],          // 坐在後腿上，後腳掌往前
    [-4, -19, 7, 12, 'F'],                             // 身體立起來
    [-1, -26, 8, 7, 'F'], [-1, -28, 2, 2, 'F'], [4, -28, 2, 2, 'F'],
    [2, -17, 4, 2, 'F'],                               // 前掌縮在胸前
  ];
  const det = [
    [-1, -18, 3, 10, 'W'], [3, -22, 4, 3, 'W'], [6, -22, 1, 1, 'P'],
    [0, -27, 1, 1, 'P'], [5, -27, 1, 1, 'P'], [4, -24, 2, 1, 'E'],   // 眯著眼專心舔
    [4, -17, 2, 1, 'W'], [-5, -8, 1, 3, 'D'], [-2, -8, 1, 3, 'D'], [1, -1, 3, 1, 'W'],
  ];
  return [parts, det];
}
function treatPose(f) {                                // 貓條：跑過去、坐在旁邊等、低頭／坐著／站起來舔、伸手搆、仰望
  switch (cat.lv) {
    case -2: return standPose(f);
    case -1: return sitPose(f, cat.paw ? 'swipe' : 'want');
    case 0: return eatPose(f);
    case 1: return sitPose(f, 'slurp');
    case 2: return standUpPose();
    case 3: return leapPose('reach');

}
const onBack = () => cat.state === 'flop' && cat.t >= ROLL && cat.t <= cat.dur - ROLL;   // 翻好肚了（不是正在躺下或翻回來）
function currentPose() {
  const f = cat.frame;
  const own = ch() && ch().pose && ch().pose(f);       // 角色的專屬狀態
  if (own) return own;
  switch (cat.state) {
    case 'loaf': return loafPose(f, cat.up);
    case 'flop': return onBack() ? flopPose(f, cat.energy < 30 || f % 12 === 11) : loafPose(f, false);   // 睏了就閉眼，不然偶爾眨眼
    case 'hunt': return standPose(f);
    case 'aim': return crouchPose(f);
    case 'leap': return cat.high ? leapPose('reach') : pouncePose();
    case 'clutch': return cat.low ? crouchPose(0) : leapPose('hold');
    case 'slap': return sitPose(f, 'swipe');
    case 'stare': case 'beg': return sitPose(f, 'stare');
    case 'drool': return sitPose(f, 'drool');
    case 'dream': return sitPose(f, 'dream');
    case 'pet': return sitPose(f, 'pet');
    case 'fetch': return standPose(f);
    case 'eat': return eatPose(f);
    case 'swipe': return sitPose(f, 'swipe');
    case 'lick': return lickPose(f);
    case 'walk': case 'chase': return standPose(f);
    case 'crouch': return crouchPose(f);
    case 'pounce': case 'hop': return pouncePose();
    case 'sleep': return sleepPose(f);
    case 'held': case 'fall': return heldPose(f);
    case 'rest': return loafPose(f, false);
    case 'zoom': case 'toLitter': case 'toTree': case 'toPom': case 'leave': case 'arrive': case 'meet': return standPose(f);
    case 'boop': return eatPose(f, true);              // 碰鼻子：低頭湊過去聞
    case 'pom': return cat.paw ? sitPose(cat.paw > SWAT / 2 ? 0 : 1, 'swipe') : sitPose(f, 'stare');   // 前掌先舉起來，再拍下去
    case 'toBox': return crouchPose(f, true);
    case 'sniffGo': return cat.poo && Math.abs(sniffAt(cat.poo) - cat.x) > 40 ? standPose(f) : crouchPose(f, true);   // 遠的時候走過去，近了才壓低
    case 'squat': return squatPose();
    case 'cover': case 'bury': return buryPose(f);
    case 'sniff': return eatPose(f, true);
    case 'stink': return sitPose(f, 'stink');
    case 'scratch': return scratchPose(f);
    case 'boo': return booPose();
    case 'spook': return spookPose();
    case 'treat': return treatPose(f);
    default: return sitPose(f, 'sit');
  }
}

// 畫一組長方形：parts 先統一描黑邊再填色，det 不描邊；dir < 0 左右翻過來；pal：顏色表（換毛色時用 coatPal 給的）
// g：畫在哪張 canvas（狀態視窗的小圖畫在另一張，見 catPicture）
function drawRects(ox, oy, parts, det, dir = 1, pal = C, g = ctx) {
  const X = (x, w) => dir > 0 ? ox + x : ox - x - w;
  g.fillStyle = pal.O;
  for (const [x, y, w, h] of parts) g.fillRect(X(x - 1, w + 2), oy + y - 1, w + 2, h + 2);
  for (const [x, y, w, h, c] of parts) { g.fillStyle = pal[c]; g.fillRect(X(x, w), oy + y, w, h); }
  for (const [x, y, w, h, c] of det)   { g.fillStyle = pal[c]; g.fillRect(X(x, w), oy + y, w, h); }
}
function drawCat() {
  if (cat.state === 'away') return;                    // 在隔壁作客
  const [parts, det, over] = look(currentPose(), myCoat, 'cat');   // 角色外觀；over：老大貓嘴上的魚乾、健身貓舉著的槓鈴
  const run = ['chase', 'hunt', 'fetch', 'zoom', 'toPom'].includes(cat.state) || (cat.state === 'treat' && cat.lv === -2);
  const ox = Math.round(cat.x) + (cat.state === 'squat' && cat.t % 8 < 4 ? 1 : 0);   // 用力到發抖
  const oy = Math.round(cat.y) - (run && cat.frame % 2 ? 1 : 0);
  drawRects(ox, oy, parts, det, cat.dir, coatPal(myCoat));
  if (over) drawRects(ox, oy, over[0], over[1], cat.dir, coatPal(myCoat));
  if (cat.state === 'treat') drawTongue(ox, oy);
  if (cat.state === 'sleep') drawZ(ox + cat.dir * 8, oy - 14);
  if (onBack() && cat.energy >= 30) drawStars(ox + cat.dir * 9, oy - 14);
}
function drawTongue(ox, oy) {                          // 舔貓條：粉紅色的舌頭從嘴巴伸到貓條的開口，一伸一縮
  if (cat.lv < 0 || cat.lv > 2 || !treat || !treat.held || cat.t % 10 >= 6) return;
  const [mx, my] = MOUTH[cat.lv], tip = treatTip();
  const x0 = ox + cat.dir * mx - (cat.dir < 0 ? 1 : 0), y0 = oy + my;
  const x1 = Math.round(tip.x), y1 = Math.round(tip.y);
  if (Math.abs(x1 - x0) > 4 || Math.abs(y1 - y0) > 6) return;
  ctx.fillStyle = C.P;
  line(x0, y0, x1, y1);
}
function drawZ(x, y, t = cat.t) {                      // 一個慢慢飄上去的 z（t：睡了幾格，客人貓用牠自己的）
  const k = (t % 120) / 120;
  const zx = Math.round(x + k * 4), zy = Math.round(y - k * 10);
  ctx.globalAlpha = 1 - k;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(zx, zy, 3, 1); ctx.fillRect(zx + 1, zy + 1, 1, 1); ctx.fillRect(zx, zy + 2, 3, 1);
  ctx.globalAlpha = 1;
}
function drawStars(x, y) {                             // 仰望星空：望著的天上有幾顆小星星輪流一閃一閃
  ctx.fillStyle = '#fff4c2';
  for (const [dx, dy, ph] of [[-5, -2, 0], [3, -8, 50], [9, 0, 100]]) {
    const k = ((cat.t + ph) % 150) / 150;
    if (k > 0.5) continue;                             // 每顆只亮一半的時間
    const sx = x + cat.dir * dx, sy = y + dy;
    ctx.globalAlpha = Math.sin(k * 2 * Math.PI);
    ctx.fillRect(sx, sy, 1, 1);
    if (k > 0.15 && k < 0.35) { ctx.fillRect(sx - 1, sy, 3, 1); ctx.fillRect(sx, sy - 1, 1, 3); }   // 最亮的時候是十字
  }
  ctx.globalAlpha = 1;
}

/* ═══ 泡泡、妙脆角、小特效 ═══ */
let snack = null;                                      // 掉下來的妙脆角 { x, y, vy, landed, bites }
const fx = [];                                         // 飄起來的愛心、餅乾屑、泡泡破掉的碎片、貓砂、臭味、驚嘆號
let quake = 0;                                         // 畫面還要震幾格（貓從紙箱蹦出來嚇你時）
function puff(kind, x, y) {
  fx.push(kind === 'heart' ? { kind, x, y, vx: rand(-0.1, 0.1), vy: -0.25, life: 70, t: 0 }
                           : { kind, x, y, vx: rand(-0.6, 0.6), vy: rand(-1.4, -0.6), life: 40, t: 0 });
}
function grit(x, y, c, vx = rand(-0.6, 0.6), vy = rand(-1.4, -0.6), life = 40) {   // 會掉到地上的小顆粒：貓砂、麻繩屑、灰塵、肉泥
  fx.push({ kind: 'grit', c, x, y, vx, vy, life, t: 0 });
}
function stink(x, y) {                                 // 一縷綠綠的臭味，扭呀扭地飄上去
  fx.push({ kind: 'stink', x, y, vx: 0, vy: -0.15, life: 70, t: 0, ph: rand(0, 6) });
}
function bang(x, y) {                                  // 驚嘆號
  fx.push({ kind: 'bang', x, y, vx: 0, vy: 0, life: 50, t: 0 });
}
function thud(x, half) {                               // 家具落地：兩邊揚起一點灰
  for (const s of [-1, 1]) for (let i = 0; i < 3; i++) grit(x + s * half, FLOOR - 1, '#d9d4c7', s * rand(0.2, 0.8), rand(-0.7, -0.2), 18);
}
function poof(x, y) {                                  // 東西收掉時的一小團白煙
  for (let i = 0; i < 6; i++) grit(x + rand(-4, 4), y, '#ffffff', rand(-0.5, 0.5), rand(-0.8, -0.2), 20);
}
function sparkle(x, y) {                               // 鏟乾淨了：一圈亮晶晶
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * 2 * Math.PI;
    fx.push({ kind: 'spark', c: i % 2 ? '#fff4c2' : '#ffffff', x, y, vx: Math.cos(a) * 0.6, vy: Math.sin(a) * 0.6, life: 22, t: 0 });
  }
}
function updateFx() {
  if (snack && !snack.landed) {
    snack.vy += G; snack.y += snack.vy;
    if (snack.y >= FLOOR) { snack.y = FLOOR; snack.landed = true; }
  }
  quake = Math.max(0, quake - 1);
  for (let i = fx.length - 1; i >= 0; i--) {
    const q = fx[i];
    q.t++; q.x += q.vx; q.y += q.vy;
    if (q.kind === 'crumb' || q.kind === 'grit') { q.vy += G; if (q.y > FLOOR) { q.y = FLOOR; q.vx = q.vy = 0; } }
    if (q.kind === 'stink') q.vx = Math.sin(q.t / 7 + q.ph) * 0.15;
    if (q.t > q.life) fx.splice(i, 1);
  }
}
function drawFx() {
  for (const q of fx) {
    ctx.globalAlpha = 1 - q.t / q.life;
    const x = Math.round(q.x), y = Math.round(q.y);
    if (q.kind === 'heart') {
      ctx.fillStyle = '#ff7aa2';
      ctx.fillRect(x, y, 1, 1); ctx.fillRect(x + 2, y, 1, 1); ctx.fillRect(x, y + 1, 3, 1); ctx.fillRect(x + 1, y + 2, 1, 1);
    } else if (q.kind === 'spark' || q.kind === 'grit') { ctx.fillStyle = q.c; ctx.fillRect(x, y, 1, 1); }
    else if (q.kind === 'stink') { ctx.fillStyle = '#a7c95b'; ctx.fillRect(x, y, 1, 2); }
    else if (q.kind === 'bang') {
      ctx.globalAlpha = Math.min(1, (q.life - q.t) / 12);
      drawRects(x, y, [[0, 0, 2, 5, 'R'], [0, 6, 2, 2, 'R']], []);
    }
    else { ctx.fillStyle = '#e9a23b'; ctx.fillRect(x, y, 1, 1); }
  }
  ctx.globalAlpha = 1;
}
function shakeView() {                                 // 碰！整條畫面震一下
  const t = quake ? `translateX(${(quake % 4 < 2 ? 1 : -1) * S}px)` : '';
  if (cv.style.transform !== t) cv.style.transform = t;
}
const SNACK = [1, 1, 2, 3, 3, 4, 5, 5];               // 妙脆角橫躺：每一欄多高（上下置中），左邊是尖端、右邊是喇叭口
function drawSnack(x, y, bites = 0) {                  // (x, y)：左下角；每咬一口少兩欄
  const n = SNACK.length - bites * 2, top = i => y - 3 - (SNACK[i] >> 1);
  ctx.fillStyle = C.O;
  for (let i = 0; i < n; i++) ctx.fillRect(x + i - 1, top(i) - 1, 3, SNACK[i] + 2);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i % 2 ? '#c97f22' : '#f0b04a';     // 一圈一圈的紋路
    ctx.fillRect(x + i, top(i), 1, SNACK[i]);
  }
  if (!bites) { ctx.fillStyle = '#7a4512'; ctx.fillRect(x + n - 1, top(n - 1) + 1, 1, SNACK[n - 1] - 2); }   // 喇叭口裡面
}
function bubbleBox() {                                 // 討摸、流口水是頭頂上的小泡泡，發呆是臉斜前方的大泡泡
  if (cat.state === 'dream') return dreamPic && bigBox(cat.dir);
  if (cat.state !== 'beg' && cat.state !== 'drool') return null;
  const w = 15, h = 11;
  const x0 = clamp(Math.round(cat.x + cat.dir * 4) - 7, 1, W - w - 1);
  const y0 = Math.round(cat.y) - 42 - (cat.t % 60 < 30 ? 0 : 1);   // 輕輕上下浮
  return { x0, y0, x1: x0 + w - 1, y1: y0 + h - 1 };
}
function drawBubble() {
  const b = bubbleBox();
  showPic(b);
  if (!b) return;
  if (cat.state === 'dream') return drawBigBubble(b);
  const w = b.x1 - b.x0 + 1, h = b.y1 - b.y0 + 1, hx = Math.round(cat.x + cat.dir * 4);
  ctx.fillStyle = C.O;                                 // 圓角框
  ctx.fillRect(b.x0 + 1, b.y0, w - 2, h); ctx.fillRect(b.x0, b.y0 + 1, w, h - 2);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(b.x0 + 1, b.y0 + 1, w - 2, h - 2);
  if (cat.state === 'beg') {                           // 說話泡泡：尾巴是一個小三角
    ctx.fillStyle = C.O; ctx.fillRect(hx - 1, b.y1, 3, 2); ctx.fillRect(hx, b.y1 + 2, 1, 1);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(hx, b.y1, 1, 1);
    ctx.fillStyle = '#ff7aa2';                         // 愛心：想被摸
    const cx = b.x0 + 5, cy = b.y0 + 2;
    for (const [x, y, ww] of [[0, 0, 2], [3, 0, 2], [-1, 1, 7], [-1, 2, 7], [0, 3, 5], [1, 4, 3], [2, 5, 1]])
      ctx.fillRect(cx + x, cy + y, ww, 1);
  } else {                                             // 想像泡泡：尾巴是兩顆小圓點
    ctx.fillStyle = C.O; ctx.fillRect(hx - 1, b.y1 + 2, 3, 3); ctx.fillRect(hx, b.y1 + 6, 2, 2);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(hx, b.y1 + 3, 1, 1);
    if (cat.want === 'treat') drawTube(b.x0 + 1, b.y0 + 5, false);
    else drawSnack(b.x0 + 3, b.y0 + 9);
  }
}

/* ═══ 大泡泡：望著一張圖片發呆 ═══
   圖片從「圖片」資料夾底下的 YarnCat 隨機挑（Rust 的 list_pictures、read_picture）；網頁版沒有資料夾，改成把圖片拖進視窗。
   快冒泡泡前先擲骰子，擲到大泡泡才去讀圖片、縮好，冒泡泡時就不用等。
   圖片用螢幕實際的解析度畫在另一個 canvas，照片才不會變成馬賽克。那個 canvas 墊在主畫布底下，
   主畫布在泡泡裡挖個洞讓它透出來，所以雷射光、逗貓棒還是畫在圖片上面。 */
const BIG = 1 / 3;                                     // 冒泡泡時有多少機率是大泡泡（沒放圖片就一定是小泡泡）
const PREP = 300;                                      // 冒泡泡前幾格先準備圖片
const PIC_W = 48, PIC_H = 28, PIC_MIN = 12;           // 圖片最寬、最高幾格；泡泡內框至少幾格，細長的圖片才不會擠成一條
let pic = null;                                        // 準備好、等著冒出來的圖片 { el, w, h }
let picSeq = 0;                                        // 又重新擲骰子的話，還沒讀完的那張就不要了
let lastPic = '';                                      // 上一次挑到哪一張，下次盡量換一張
let dreamPic = null;                                   // 大泡泡裡正在想的圖片
const dropped = [];                                    // 網頁版拖進來的圖片

function preparePic() {
  pic = null;
  const seq = ++picSeq;
  if (Math.random() < BIG) loadPic().then(p => { if (seq === picSeq) pic = p; });
}
async function loadPic() {                             // 隨機挑一張圖片縮成泡泡的大小；沒有圖片、讀不了就是 null
  try {
    const blob = await pickPic();
    if (!blob) return null;
    const url = URL.createObjectURL(blob);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      return fitPic(img);
    } finally { URL.revokeObjectURL(url); }
  } catch (_) { return null; }
}
async function pickPic() {
  if (!TAURI) return pickNew(dropped, f => f.name);
  const name = pickNew(await TAURI.core.invoke('list_pictures'), n => n);
  if (!name) return null;
  return new Blob([new Uint8Array(await TAURI.core.invoke('read_picture', { name }))]);
}
function pickNew(list, nameOf) {                       // 隨機挑一個，盡量不要跟上一次同一張
  let pool = list.filter(x => nameOf(x) !== lastPic);
  if (!pool.length) pool = list;
  const x = pool[Math.floor(Math.random() * pool.length)];
  if (x) lastPic = nameOf(x);
  return x;
}
function fitPic(img) {                                 // 縮成泡泡的大小，畫在一張螢幕解析度的 canvas 上
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return null;
  let f = Math.min(PIC_W / nw, PIC_H / nh);
  if (f >= 1) f = Math.floor(f);                       // 小圖（像素畫）放大整數倍，跟貓一樣一格一格的
  const w = Math.max(1, Math.round(nw * f)), h = Math.max(1, Math.round(nh * f));
  const k = Math.round(S * (window.devicePixelRatio || 1));   // 一格佔幾個實體像素
  const el = document.createElement('canvas');
  el.width = w * k; el.height = h * k;
  const c = el.getContext('2d');
  if (f >= 1) { c.imageSmoothingEnabled = false; c.drawImage(img, 0, 0, el.width, el.height); }
  else shrink(c, img, el.width, el.height);
  return { el, w, h };
}
function shrink(c, img, tw, th) {                      // 照片縮很多倍：先一次縮一半，最後再縮到剛好，才不會有鋸齒
  let src = img, w = img.naturalWidth, h = img.naturalHeight;
  while (w > tw * 2 && h > th * 2) {
    w = Math.ceil(w / 2); h = Math.ceil(h / 2);
    const t = document.createElement('canvas');
    t.width = w; t.height = h;
    t.getContext('2d').drawImage(src, 0, 0, w, h);
    src = t;
  }
  c.imageSmoothingQuality = 'high';
  c.drawImage(src, 0, 0, tw, th);
}

function dream(p) {                                    // 冒大泡泡
  dreamPic = p;
  const b = bigBox(cat.dir);
  if (b.x0 < 1 || b.x1 > W - 2) cat.dir = -cat.dir;   // 臉前面放不下就轉身
  setState('dream', 600);
}
function dreamNow() {                                  // 網頁版：拖進圖片、按 6，馬上冒大泡泡
  loadPic().then(p => { if (p && !['held', 'away'].includes(cat.state) && cat.y >= FLOOR && !cat.in) dream(p); });   // 在隔壁作客時不算
}
function bigBox(dir) {                                 // 大泡泡在臉的斜前方，底邊大約在眼睛的高度；太高的話從畫面頂端往下長
  const iw = Math.max(dreamPic.w, PIC_MIN), ih = Math.max(dreamPic.h, PIC_MIN);
  const w = iw + 6, h = ih + 6, ox = Math.round(cat.x), bob = cat.t % 60 < 30 ? 0 : 1;
  const x0 = dir > 0 ? ox + 14 : ox - 14 - w;
  const y0 = Math.max(1, Math.round(cat.y) - 13 - h) - bob;
  return { x0, y0, x1: x0 + w - 1, y1: y0 + h - 1, bob,   // ix、iy、iw、ih：圖片的位置，在內框裡置中
    ix: x0 + 3 + ((iw - dreamPic.w) >> 1), iy: y0 + 3 + ((ih - dreamPic.h) >> 1), iw: dreamPic.w, ih: dreamPic.h };
}
function drawBigBubble(b) {
  const w = b.x1 - b.x0 + 1, h = b.y1 - b.y0 + 1;
  ctx.fillStyle = C.O;                                 // 圓角框，泡泡大，角也圓一點
